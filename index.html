2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n@keyframes bk-card-in{from{transform:translateY(6px)}to{transform:translateY(0)}}\n@keyframes bk-owned-pulse{0%,100%{box-shadow:0 4px 24px rgba(76,175,80,.25),0 0 0 1.5px rgba(76,175,80,.35)}50%{box-shadow:0 4px 32px rgba(76,175,80,.55),0 0 0 2px rgba(76,175,80,.7)}}\n@keyframes bk-shimmer{0%{left:-120%}100%{left:160%}}\n@keyframes notif-slide{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}\n@keyframes promo-ken{0%{transform:scale(1)}100%{transform:scale(1.06)}}\n\n.bk-page{padding:0 4px 24px}\n\n/* \u2500\u2500 Page title row \u2500\u2500 */\n.bk-title-row{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:14px 0 10px;\n}\n.bk-page-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:.3px}\n.bk-sort-btn{\n  display:flex;align-items:center;gap:5px;\n  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);\n  border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;\n}\n\n/* \u2500\u2500 Promo / notification banner \u2500\u2500 */\n.bk-promo{\n  border-radius:16px;margin-bottom:14px;overflow:hidden;\n  position:relative;height:110px;\n  background:linear-gradient(135deg,#1a0000 0%,#6b0000 50%,#c62828 100%);\n  box-shadow:0 6px 28px rgba(0,0,0,.55);\n}\n.bk-promo-bg{\n  position:absolute;inset:0;overflow:hidden;\n}\n.bk-promo-bg img{\n  width:100%;height:100%;object-fit:cover;opacity:.45;\n  animation:promo-ken 8s ease-in-out infinite alternate;\n}\n.bk-promo-overlay{\n  position:absolute;inset:0;\n  background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.2) 60%,transparent 100%);\n}\n.bk-promo-content{\n  position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;gap:12px;\n}\n.bk-promo-icon{font-size:44px;filter:drop-shadow(0 r:#fff;cursor:default;\n}\n/* \u2550\u2550 BIKE DETAIL MODAL STYLES \u2550\u2550 */\n.bk-detail-overlay{\n  display:none;position:fixed;inset:0;z-index:600;\n  background:rgba(0,0,0,.65);\n  align-items:flex-end;justify-content:center;\n}\n.bk-detail-overlay.open{display:flex}\n.bk-detail-sheet{\n  width:100%;max-width:480px;\n  background:#111;\n  border-radius:24px 24px 0 0;\n  overflow:hidden;\n  animation:su .3s ease;\n  max-height:92vh;overflow-y:auto;\n}\n.bk-detail-img{\n  width:100%;height:200px;object-fit:cover;display:block;\n}\n.bk-detail-body{padding:16px 18px 24px;background:transparent;}\n.bk-detail-class{\n  display:inline-flex;align-items:center;\n  background:rgba(255,255,255,.1);border-radius:20px;\n  padding:4px 14px;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);\n  margin-bottom:14px;\n}\n.bk-detail-section-title{\n  font-size:17px;font-weight:800;color:#fff;margin-bottom:12px;\n}\n/* Stat bars */\n.bk-detail-stat{\n  display:flex;align-items:center;gap:10px;margin-bottom:10px;\n}\n.bk-detail-stat-name{\n  font-size:14px;font-weight:700;color:rgba(255,255,255,.8);width:90px;flex-shrink:0;\n}\n.bk-detail-bar-wrap{\n  flex:1;height:14px;background:rgba(255,255,255,.1);border-radius:7px;overflow:hidden;\n}\n.bk-detail-bar-fill{\n  height:100%;border-radius:7px;\n  background:linear-gradient(90deg,#39FF14,#00C9A7);\n  transition:width .4s ease;\n}\n.bk-detail-stat-val{\n  font-size:14px;font-weight:800;color:#fff;width:34px;text-align:right;flex-shrink:0;\n}\n/* Earnings section */\n.bk-detail-earn-title{\n  font-size:17px;font-weight:800;color:#fff;margin:16px 0 10px;\n}\n.bk-detail-earn-row{\n  display:flex;align-items:center;gap:10px;\n  padding:10px 0;\n  border-bottom:1px solid rgba(255,255,255,.08);\n}\n.bk-detail-earn-row:last-child{border-bottom:none;}\n.bk-detail-ton-icon{\n  width:28px;height:28px;border-radius:50%;object-fit:contain;flex-shrink:0;\n}\n.bk-detail-earn-val{\n  font-size:15px;font-weight:800;color:#fff;flex:1;\n}\n.bk-detail-earn-arrow{font-size:16px;color:rgba(255,255,255,.4);}\n.bk-detail-earn-period{\n  font-size:14px;font-weight:700;color:rgba(255,255,255,.6);\n}\n/* Close + buy btn */\n.bk-detail-actions{\n  display:flex;gap:10px;margin-top:18px;\n}\n.bk-detail-close-btn{\n  flex-shrink:0;width:44px;height:44px;border-radius:50%;\n  background:rgba(255,255,255,.15);border:none;font-size:20px;cursor:pointer;color:#fff;\n  display:flex;align-items:center;justify-content:center;\n}\n.bk-detail-buy-btn{\n  flex:1;padding:13px;border:none;border-radius:14px;\n  background:linear-gradient(90deg,#43A047,#66BB6A);\n  color:#fff;font-size:15px;font-weight:800;cursor:pointer;\n  box-shadow:0 4px 14px rgba(76,175,80,.4);\n}\n.bk-detail-owned-btn{\n  flex:1;padding:13px;border:none;border-radius:14px;\n  background:linear-gradient(90deg,#388E3C,#4CAF50);\n  color:#fff;font-size:15px;font-weight:800;cursor:default;\n}\n\n\n    #sectionFriends{padding:0!important;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:78px;z-index:5}\n    .mine-map{position:absolute;inset:0;background:url('https://res.cloudinary.com/dktppfipy/image/upload/v1778463490/e44ea9db-c50f-4be7-82b6-b74540fc7034_a7z3nk.png') center center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;\n      /* \u0645\u0646\u0639 \u0627\u0644\u0640 background image \u0645\u0646 \u0627\u0644\u0640 flicker */\n      transform:translateZ(0);\n      will-change:auto;\n      -webkit-transform:translateZ(0);\n    }\n    .mine-map::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.55) 100%);pointer-events:none;z-index:1}\n\n    /* Floating topbar (avatar+name | TON balance) \u2014 same style as home topbar but no background */\n    .mine-topbar{\n      position:absolute;top:0;left:0;right:0;z-index:20;\n      display:flex;align-items:center;\n      padding:12px 14px 8px;gap:10px;background:transparent;\n ground:rgba(255,255,255,.25);transition:all .2s;cursor:pointer;}\n.race-dot.active{background:var(--raseen);width:22px;border-radius:4px;}\n\n/* \u2500\u2500 Owned-bike thumbnails strip (under big card) \u2500\u2500 */\n.race-thumbs-outer{\n  width:100%;padding:14px 12px 0;overflow:hidden;\n}\n.race-thumbs-track{\n  display:flex;gap:8px;overflow-x:auto;\n  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;\n  scrollbar-width:none;padding:4px 2px 8px;\n}\n.race-thumbs-track::-webkit-scrollbar{display:none}\n.race-thumb{\n  flex:0 0 calc(20% - 7px);\n  min-width:64px;\n  border-radius:14px;overflow:hidden;cursor:pointer;\n  background:rgba(0,0,0,.55);\n  border:1.5px solid rgba(255,255,255,.08);\n  position:relative;transition:all .25s;\n  scroll-snap-align:start;opacity:.55;\n}\n.race-thumb.active{\n  border-color:var(--raseen);\n  box-shadow:0 0 0 1px var(--raseen),0 0 14px rgba(124,179,66,.55);\n  opacity:1;transform:translateY(-2px);\n}\n.race-thumb-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}\n.race-thumb-name{\n  font-size:9.5px;font-weight:800;color:#fff;\n  text-align:center;padding:3px 2px 1px;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n.race-thumb-lvl{\n  font-size:9px;font-weight:700;color:rgba(255,255,255,.6);\n  text-align:center;padding:0 2px 4px;\n}\n.race-thumb-check{\n  position:absolute;top:4px;right:4px;\n  width:18px;height:18px;border-radius:50%;\n  background:var(--raseen);color:#000;font-size:11px;font-weight:900;\n  display:none;align-items:center;justify-content:center;\n}\n.race-thumb.active .race-thumb-check{display:flex;}\n\n/* \u2500\u2500 Stats card (under thumbnails) \u2500\u2500 */\n.race-stats-card{\n  margin:14px 12px 0;\n  background:\n    linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),\n    url('https://res.cloudinary.com/dktppfipy/image/upload/v1778463362/5716da26-83d2-4109-838f-5e5869107b6b_pc0aut.png') center/cover no-repeat;\n  border:1px solid rgba(124,179,66,.25);\n  border-radius:18px;\n  padding:14px 14px;\n  display:flex;align-items:center;gap:12px;\n  \n}\n.race-stats-list{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}\n.race-stat-row{\n  display:grid;grid-template-columns:46px 92px 1fr 44px;\n  align-items:center;gap:10px;\n}\n.race-stat-icon{\n  width:46px;height:46px;display:flex;align-items:center;justify-content:center;\n  font-size:15px;color:var(--raseen);border-radius:10px;overflow:hidden;\n}\n.race-stat-icon img{width:100%;height:100%;object-fit:cover;display:block;}\n.race-stat-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);}\n.race-stat-bar{height:9px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden;}\n.race-stat-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#FFA000,#FFD600);}\n.race-stat-num{font-size:15px;font-weight:800;color:#fff;text-align:right;}\n/* Hex level badge */\n.race-level-hex{\n  flex-shrink:0;width:88px;height:96px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  position:relative;\n  -webkit-clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  background:rgba(0,0,0,.7);\n}\n.race-level-hex::before{\n  content:'';position:absolute;inset:2px;\n  background:rgba(8,18,8,.95);\n  -webkit-clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  z-index:0;\n}\n.race-level-hex-border{\n  position:absolute;inset:0;\n  background:var(--raseen);\n  -webkit-clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);\n  z-index:-1;\n  filter:drop-shadow(0 0 6px var(--raseen-glow));\n}\n.race-level-hex > *{position:relative;z-index:1;}\n.race-level-hex .lbl{\n  font-size:11px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:1px;\n}\n.race-level-hex var HEAD_SCRIPTS = [{"type": "ext", "src": "https://telegram.org/js/telegram-web-app.js"}, {"type": "inline", "code": "\n/* Register asset cache service worker \u2014 downloads images/models once,\n   then serves them from device storage on every later visit. */\nif ('serviceWorker' in navigator) {\n  window.addEventListener('load', () => {\n    navigator.serviceWorker.register('sw.js')\n      .then(() => {\n        // Background preload of bike GLB models so they're ready before any race.\n        // Uses requestIdleCallback to avoid blocking the UI; SW caches each one\n        // on first fetch, so future requests are instant + offline-friendly.\n        const schedule = (cb) => setTimeout(cb, 8000);\n        schedule(async () => {\n          const cache = await caches.open('race-assets-v2');\n          const queue = async (url) => {\n            try {\n              const hit = await cache.match(url, { ignoreVary: true });\n              if (hit) return;\n              await fetch(url, { cache: 'reload', mode: 'cors', credentials: 'omit' })\n                .catch(() => fetch(url, { cache: 'reload' }));\n            } catch (e) { /* ignore */ }\n          };\n          // 1) Bike GLB models (Level 0..7)\n          for (let lv = 0; lv <= 7; lv++) {\n            await queue('Bike%20Level%20' + lv + '.glb');\n          }\n          // 2) All website images \u2014 scan DOM + CSS for image URLs and preload them\n          const collectImageUrls = () => {\n            const urls = new Set();\n            // <img src>\n            document.querySelectorAll('img[src]').forEach(el => {\n              const s = el.getAttribute('src'); if (s) urls.add(s);\n            });\n            // CSS rules: background-image url(...)\n            const urlRe = /url\\(\\s*['\"]?([^'\")]+\\.(?:png|jpe?g|webp|gif|svg|avif))(?:\\?[^'\")]*)?['\"]?\\s*\\)/gi;\n            // Inline HTML scan (covers JS string literals + style attrs)\n            try {\n              const html = document.documentElement.outerHTML;\n              let m; while ((m = urlRe.exec(html))) urls.add(m[1]);\n            } catch (e) {}\n            // Stylesheet rules\n            for (const sheet of Array.from(document.styleSheets)) {\n              let rules; try { rules = sheet.cssRules; } catch (e) { continue; }\n              if (!rules) continue;\n              for (const rule of Array.from(rules)) {\n                const t = rule.cssText || '';\n                let m; urlRe.lastIndex = 0;\n                while ((m = urlRe.exec(t))) urls.add(m[1]);\n              }\n            }\n            return Array.from(urls).filter(u => /^https?:\\/\\//i.test(u));\n          };\n          const imgs = collectImageUrls();\n          console.log('[preload] images found:', imgs.length);\n          // Throttle: 4 in parallel\n          let i = 0;\n          const workers = Array.from({ length: 4 }, async () => {\n            while (i < imgs.length) {\n              const u = imgs[i++];\n              await queue(u);\n            }\n          });\n          await Promise.all(workers);\n          console.log('[preload] all images cached');\n        });\n      })\n      .catch(err => console.warn('SW register failed', err));\n  });\n}\n"}, {"type": "ext", "src": "https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"}, {"type": "ext", "src": "https://unpkg.com/tonweb/dist/tonweb.js"}];
var BODY_SCRIPTS = [{"type": "inline", "code": "\n\n\n\n// Bike data removed\n\n\n\n/* \u2550\u2550 BIKE DETAIL MODAL \u2550\u2550 */\n\n\n\n\n\n// Topbar sync\n// (call after buy/upgrade/mining so users don't need to reload).\n
\nfunction syncTopbar(){\n  // tbCoins element is inside TON topbar section => show TON balance\n  const tonBal = S.user?.tonBalance||0;\n  const el = document.getElementById('tbCoins');\n  if(el) el.textContent = tonBal.toFixed(4);\n  // Also update finance header\n  if(typeof syncFinanceHeader === 'function') syncFinanceHeader();\n  // Garage page TON balance\n  const gTon = document.getElementById('garageTonBal');\n  if(gTon) gTon.textContent = tonBal.toFixed(4);\n  // User name\n  const nameEl = document.getElementById('hubUserName');\n  if(nameEl){\n    const name = S._tgName || S.user?.firstName||S.user?.name||'Player';\n    nameEl.textContent = name;\n  }\n  // User avatar\n  const avEl = document.getElementById('hubAvatar');\n  if(avEl && S.user?.photoUrl){\n    avEl.innerHTML = `<img src=\"${S.user.photoUrl}\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%\">`;\n  }\n}\n\n// Hook into page load\ndocument.addEventListener('DOMContentLoaded', ()=>{\n  setTimeout(()=>{ syncTopbar(); }, 800);\n  setInterval(()=>{ syncTopbar(); if(typeof syncMineTopbar==='function') syncMineTopbar(); if(typeof syncProfileTopbar==='function') syncProfileTopbar(); }, 10000);\n});\n\n/* \u2550\u2550\u2550\u2550 GARAGE SYSTEM \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Shows only owned bikes with upgrade system\n   Upgrade price = bike.price / 4 TON\n   Stat increment: speed/nitro/accel +5, maneuver +3\n   Max = base * 2\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst STAT_ICONS = {\n  speed:   '<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463286/5a4381c9-4e96-404a-b52c-fb14f4fd0b4a_diu77b.png\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">',\n  accel:   '<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463371/89286e70-78c0-4d6e-a850-2f17c5263622_ejjdsu.png\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">',\n  maneuver:'<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463289/9e729fba-39b5-4b46-be3d-c9e9a784bda0_fa0sx8.png\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">',\n  nitro:   '<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463310/41ff0b55-d90f-4bd7-b964-d108589e3ef9_fz4pvv.png\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">'\n};\nconst STAT_LABELS = { speed:'\u0421\u043a\u043e\u0440\u043e\u0441\u0442\u044c', nitro:'\u041d\u0438\u0442\u0440\u043e', accel:'\u0420\u0430\u0437\u0433\u043e\u043d', maneuver:'\u041c\u0430\u043d\u0435\u0432\u0440\u044b' };\nconst UPGRADE_INC = { speed:5, nitro:5, accel:5, maneuver:3 };\n\n\n\nlet _garageSelectedLv = null;\n\n\n\n\n\n\n\n\n\n\n/* \u2500\u2500 Bike Info Modal (Race page) \u2500\u2500 */\n\n\n\n\nlet _upgradeInFlight = false;\nasync \n"}, {"type": "inline", "code": "\n  \n  \n  /* Sync floating Mine topbar with user data\n     Strategy: MIRROR the already-rendered Home topbar DOM (hubAvatar / hubUserName / tbCoins).\n     This guarantees Farm shows the exact same data as Home \u2014 if Home loaded it, Farm gets it. */\n  \n  // Expose globally so it can be called from BootSeq + intervals\n  window.syncMineTopbar = syncMineTopbar;\n  // Also re-sync whenever the Home topbar updates: hook into syncTopbar\n  (function(){\n    try{\n      const _origSync = window.syncTopbar;\n      if(typeof _origSync === 'function' && !_origSync._mineHooked){\n        window.syncTopbar = function(){\n          const r = _origSync.apply(this, arguments);\n          try{ syncMineTopbar(); }catch(e){}\n          return r;\n        };\n        window.syncTopbar._mineHooked = true;\n      }\n    }catch(e){}\n  })();\n\n  /* \u2550\u2550 PROFILE TOPBAR SYNC \u2014 mirror Home topbar into Profile hero \u2550\u2550 */\n  function syncProfileTopbar(){\n    try{\n      const av = document.getElementById('pfAvatar');\n      const nm = document.getElementById('pfUserName');\n      const tp = document.getElementById('pfTonPill');\n      const fb = document.getElementById('finTonBal');\n\n      const srcAv = document.getElementById('hubAvatar');\n      const srcNm = document.getElementById('hubUserName');\n      const srcTb = document.getElementById('tbCoins');\n\n      const u = (window.S && S.user) || {};\n      const tgUser = (window.S && S.tg && S.tg.initDataUnsafe && S.tg.initDataUnsafe.user) || {};\n\n      if(av){\n        const srcImg = srcAv && srcAv.querySelector('img');\n        const photo = (srcImg && srcImg.src) || u.photoUrl || tgUser.photo_url || null;\n        const cur = av.dataset.photoSrc || '';\n        if(photo && photo !== cur){\n          av.innerHTML = `<img src=\"${photo}\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%\" onerror=\"this.parentNode.innerHTML='<span>\ud83c\udfcd\ufe0f</span>';this.parentNode.dataset.photoSrc='';\">`;\n          av.dataset.photoSrc = photo;\n        } else if(!photo && !av.querySelector('img')){\n          av.innerHTML = '<span>\ud83c\udfcd\ufe0f</span>';\n        }\n      }\n      if(nm){\n        const homeName = srcNm ? (srcNm.textContent||'').trim() : '';\n        const tgName = ((tgUser.first_name||'') + ' ' + (tgUser.last_name||'')).trim();\n        const name = (homeName && homeName !== 'Player') ? homeName\n                   : ((window.S && S._tgName) || tgName || tgUser.username || u.firstName || u.username || u.name || 'Player');\n        if(nm.textContent !== name) nm.textContent = name;\n      }\n      const hd = document.getElementById('pfUserHandle');\n      if(hd){\n        const uname = tgUser.username || u.username || '';\n        const handle = uname ? ('@'+uname) : '';\n        if(hd.textContent !== handle) hd.textContent = handle;\n        hd.style.display = handle ? '' : 'none';\n      }\n      if(tp){\n        let val = srcTb ? (srcTb.textContent||'').trim() : '';\n        if(!val || val === '0'){\n          const bal = (u.tonBalance!=null ? u.tonBalance : 0);\n          val = (Number(bal)||0).toFixed(4);\n        }\n        if(tp.textContent !== val) tp.textContent = val;\n      }\n      if(fb){\n        let v = '';\n        const tbVal = srcTb ? (srcTb.textContent||'').trim() : '';\n        if(tbVal && !isNaN(parseFloat(tbVal.replace(/,/g,'')))){\n          v = parseFloat(tbVal.replace(/,/g,'')).toFixed(4);\n        } else {\n          const bal = (u.tonBalance!=null ? u.tonBalance : 0);\n          v = (Number(bal)||0).toFixed(4);\n        }\n        if(fb.textContent !== v) fb.textContent = v;\n      }\n    }catch(e){ console.warn('syncProfileTopbar:', e.message); }\n  }\n  window.syncProfileTopbar = syncProfileTopbar;\n  (function(){\n    try{\n      const _orig = window.syncTopbar;\n      if(typeof _orig === 'function' && !_orig._pfHooked){\n        window.syncTopbar = function(){\n          const r = _orig.apply(this, arguments);\n          try{ syncProfileTopbar(); }catch(e){}\n          return r;\n        };\n        window.syncTopbar._pfHooked = true;\n      }\n    }catch(e){}\n  })();\n  "}, {"type": "inline", "code": "\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   RASEEN \u2014 Race Engine v3.0\n   Canvas-based road rendering for correct perspective\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n(function(){\n\n  /* \u2500\u2500\u2500 State \u2500\u2500 */\n  let _raceIdx          = 0;\n  let _raceBikes        = [];\n  let _raceActive       = false;\n  let _raceRafId        = null;\n  let _raceAnimInterval = null;\n  let _raceSelectedBike = null;\n  let _raceStarted      = false;\n  let _touchStartX      = 0;\n\n  /* Road canvas animation state */\n  let _roadScroll    = 0;\n  let _finishVisible = false;\n  let _finishPos     = 0;    /* 0=at horizon, 1=at bottom */\n  let _bgImg         = null; /* preloaded background image */\n  let _finishImg     = null; /* preloaded finish banner image */\n\n  const OPP_NAMES = [\n    '@Kilorok','@SpeedKing','@TurboMax','@NitroX','@RallyAce',\n    '@DustRider','@JungleRun','@FastWave','@RaceKing','@DriftMaster'\n  ];\n\n  /* \u2500\u2500\u2500 Preload images once \u2500\u2500 */\n  (function preloadRaceImages(){\n    _bgImg = new Image();\n    _bgImg.src = '';\n    _finishImg = new Image();\n    _finishImg.src = '';\n  })();\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     CANVAS ROAD RENDERER\n     Draws a proper perspective road \u2014 like a 2D racing game.\n  \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  \n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     CAROUSEL INIT\n  \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  window._raceInit = function(){\n    /* Update floating topbar (avatar + name + ton balance) */\n    try{\n      const av=document.getElementById('raceAvatar');\n      const nm=document.getElementById('raceUserName');\n      const tb=document.getElementById('raceTonBal');\n      if(S && S.user){\n        const photoUrl = S.user.photoUrl||(S?.tg?.initDataUnsafe?.user?.photo_url)||null;\n        if(av && photoUrl) av.innerHTML = `<img src=\"${photoUrl}\" onerror=\"this.parentNode.innerHTML='<span>\ud83c\udfcd\ufe0f</span>'\">`;\n        if(nm) nm.textContent = S.user.firstName||S._tgName||'Player';\n        if(tb) tb.textContent = (S.user.tonBalance||0).toFixed(4);\n      }\n    }catch(e){}\n\n    _raceBikes = [];\n    if(S && S.user && S.user.ownedBikes && S.user.ownedBikes.length > 0){\n      S.user.ownedBikes.forEach(lv=>{\n        const b = BIKES.find(x=>x.lv===lv);\n        if(b && !isBikeMiningActive(lv)) _raceBikes.push(b);\n      });\n    }\n    const track = document.getElementById('raceCarouselTrack');\n    if(!track) return;\n    const sf = document.getElementById('raceStartFixed');\n    if(sf) sf.style.display = 'block';\n    if(_raceBikes.length === 0){\n      track.innerHTML = '<div style=\"min-width:100%;text-align:center;padding:40px 20px;color:rgba(255,255,255,.7);font-size:14px;font-weight:700\"><div style=\"font-size:48px;margin-bottom:12px\">\ud83c\udfcd\ufe0f</div><div>'+tr('noBikesAvail')+'<br><span style=\"color:var(--raseen);cursor:pointer;text-decoration:underline\" onclick=\"goNavBySection(\\'sectionMarket\\')\">'+tr('buyOneInGarage')+'</span></div></div>';\n      const dotsEl=document.getElementById('raceDots'); if(dotsEl) dotsEl.innerHTML='';\n      const thEl=document.getElementById('raceThumbsTrack'); if(thEl) thEl.innerHTML='';\n      const sl=document.getElementById('raceStatsList'); if(sl) sl.innerHTML='';\n      const lvNum=document.getElementById('raceLevelNum'); if(lvNum) lvNum.textContent='-';\n      return;\n    }\n    _raceIdx = 0;\n    _buildCarousel();\n    _buildThumbs();\n  };\n\n  window.goNavBySection = function(s){\n    const el=document.querySelector('.ni[data-s=\"'+s+'\"]');if(el)goNav(el);\n  };\n\n  window.raceArrow = function(dir){ _goSlide(_raceIdx + (dir>0?1:-1)); };\n  window._raceGetCurrentBike = function(){ return _raceBikes[_raceIdx] || null; };\n\n  function _buildCarousel(){\n    const track=document.getElementById('raceCarouselTrack');\n    const dots=document.getElementById('raceDots');\n    if(!track||!dots) return;\n    track.innerHTML='';dots.innerHTML='';\n    _raceBikes.forEach((b,i)=>{\n      const slide=document.createElement('div');\n      slide.style.transition='none';\n      slide.className='race-bike-slide'+(i===0?' active':'');\n      slide.dataset.idx=i;\n      const wrap=document.createElement('div');\n      wrap.className='race-bike-img-wrap';\n      const img=document.createElement('img');\n      img.src=b.img;img.alt=b.name;\n      img.onerror=function(){this.style.opacity='.2';};\n      const brand=document.createElement('div');\n      brand.className='race-bike-brand';\n      brand.textContent='Bike';\n      const model=document.createElement('div');\n      model.className='race-bike-model';\n      model.textContent='Level '+b.lv;\n      wrap.appendChild(img);\n      wrap.appendChild(brand);\n      wrap.appendChild(model);\n      slide.appendChild(wrap);track.appendChild(slide);\n      const dot=document.createElement('div');\n      dot.className='race-dot'+(i===0?' active':'');\n      dot.onclick=(()=>{const idx=i;return()=>_goSlide(idx);})();\n      dots.appendChild(dot);\n    });\n    _goSlide(0);\n    requestAnimationFrame(()=>{\n      requestAnimationFrame(()=>{\n        track.querySelectorAll('.race-bike-slide').forEach(s=>{s.style.transition='';});\n      });\n    });\n  }\n\n  function _buildThumbs(){\n    const tr = document.getElementById('raceThumbsTrack');\n    if(!tr) return;\n    tr.innerHTML = '';\n    _raceBikes.forEach((b,i)=>{\n      const t = document.createElement('div');\n      t.className = 'race-thumb' + (i===_raceIdx?' active':'');\n      t.dataset.idx = i;\n      t.innerHTML = `\n        <div class=\"race-thumb-check\">\u2713</div>\n        <img class=\"race-thumb-img\" src=\"${b.img}\" onerror=\"this.style.opacity='.2'\">\n        <div class=\"race-thumb-name\">Level ${b.lv}</div>\n        <div class=\"race-thumb-lvl\">Lv ${b.lv}</div>\n      `;\n      t.onclick = ()=>_goSlide(i);\n      tr.appendChild(t);\n    });\n  }\n\n  function _renderStats(b){\n    const list=document.getElementById('raceStatsList');\n    const lvNum=document.getElementById('raceLevelNum');\n    if(!list) return;\n    const stats=(typeof getBikeCurrentStats==='function')?getBikeCurrentStats(b):{speed:b.speed,nitro:b.nitro,accel:b.accel,maneuver:b.maneuver};\n    const max={speed:b.speed*2,accel:b.accel*2,maneuver:b.maneuver*2,nitro:b.nitro*2};\n    function pct(k){ return Math.min(100, Math.round(stats[k]/max[k]*100)); }\n    const ICONS = {\n      speed:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463286/5a4381c9-4e96-404a-b52c-fb14f4fd0b4a_diu77b.png',\n      accel:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463371/89286e70-78c0-4d6e-a850-2f17c5263622_ejjdsu.png',\n      maneuver:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463289/9e729fba-39b5-4b46-be3d-c9e9a784bda0_fa0sx8.png',\n      nitro:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463310/41ff0b55-d90f-4bd7-b964-d108589e3ef9_fz4pvv.png'\n    };\n    list.innerHTML = `\n      <div class=\"race-stat-row\">\n        <div class=\"race-stat-icon\"><img src=\"${ICONS.speed}\"></div>\n        <div class=\"race-stat-name\">Speed</div>\n        <div class=\"race-stat-bar\"><div class=\"race-stat-fill\" style=\"width:${pct('speed')}%\"></div></div>\n        <div class=\"race-stat-num\">${stats.speed}</div>\n      </div>\n      <div class=\"race-stat-row\">\n        <div class=\"race-stat-icon\"><img src=\"${ICONS.accel}\"></div>\n        <div class=\"race-stat-name\">Acceleration</div>\n        <div class=\"race-stat-bar\"><div class=\"race-stat-fill\" style=\"width:${pct('accel')}%\"></div></div>\n        <div class=\"race-stat-num\">${stats.accel}</div>\n      </div>\n      <div class=\"race-stat-row\">\n        <div class=\"race-stat-icon\"><img src=\"${ICONS.maneuver}\"></div>\n        <div class=\"race-stat-name\">Handling</div>\n        <div class=\"race-stat-bar\"><div class=\"race-stat-fill\" style=\"width:${pct('maneuver')}%\"></div></div>\n        <div class=\"race-stat-num\">${stats.maneuver}</div>\n      </div>\n      <div class=\"race-stat-row\">\n        <div class=\"race-stat-icon\"><img src=\"${ICONS.nitro}\"></div>\n        <div class=\"race-stat-name\">Nitro</div>\n        <div class=\"race-stat-bar\"><div class=\"race-stat-fill\" style=\"width:${pct('nitro')}%\"></div></div>\n        <div class=\"race-stat-num\">${stats.nitro}</div>\n      </div>\n    `;\n    if(lvNum) lvNum.textContent = b.lv;\n  }\n\n  function _goSlide(i){\n    _raceIdx=Math.max(0,Math.min(_raceBikes.length-1,i));\n    const track=document.getElementById('raceCarouselTrack');\n    if(!track) return;\n    /* Only show the active slide \u2014 hide all others */\n    document.querySelectorAll('.race-bike-slide').forEach((s,j)=>s.classList.toggle('active',j===_raceIdx));\n    document.querySelectorAll('.race-dot').forEach((d,j)=>d.classList.toggle('active',j===_raceIdx));\n    document.querySelectorAll('.race-thumb').forEach((d,j)=>d.classList.toggle('active',j===_raceIdx));\n    /* No translateX needed \u2014 only active card is displayed */\n    track.style.transform='';\n    /* Scroll active thumb into view */\n    requestAnimationFrame(()=>{\n      const activeTh=document.querySelector('.race-thumb.active');\n      if(activeTh) activeTh.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});\n    });\n    const b=_raceBikes[_raceIdx];\n    if(b) _renderStats(b);\n  }\n\n  /* swipe on big carousel card disabled \u2014 navigation is via thumbnails only */\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     START RACE \u2014 PvP matchmaking, server-authoritative outcome.\n     Flow: joinQueue \u2192 poll \u2192 matched \u2192 load engine \u2192 show result.\n     Cancel allowed only while still in queue (refunds 0.5 TON).\n  \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  let _raceReady=false, _raceShowFn=null;\n  let _racePending=null;\n  let _racePollTimer=null;\n  let _raceQueueing=false;\n\n  function _raceStopPolling(){\n    if(_racePollTimer){ clearInterval(_racePollTimer); _racePollTimer=null; }\n  }\n\n  function _ensureLoadingOverlay(){\n    let loadOv=document.getElementById('raceLoadingOv');\n    if(loadOv) return loadOv;\n    loadOv=document.createElement('div');\n    loadOv.id='raceLoadingOv';\n    loadOv.style.cssText='position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .3s;padding-top:0;padding-bottom:60px;text-align:center;background:url(\\'https://res.cloudinary.com/dktppfipy/image/upload/v1778675637/27df1ed1-e909-4a5f-a23a-23a3b4d7f42b_hliyq6.jpg\\') center/cover no-repeat';\n    loadOv.innerHTML=[\n      '<div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.6) 100%);pointer-events:none;\"></div>',\n      /* Logo in center */\n      '<div style=\"position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:0 24px;\">',\n        '<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778679700/bd57c63b-71a1-4114-8207-3763fbab038f-removebg-preview_hgqgis.png\" id=\"rqLogo\" style=\"width:820px;max-width:100vw;height:auto;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.8));\" onerror=\"this.style.display=\\'none\\'\">',\n      '</div>',\n      /* Bottom bar section */\n      '<div style=\"position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:0 24px 0;\">',\n        '<div id=\"rqTitle\" style=\"font-size:18px;font-weight:800;color:#fff;font-family:Fredoka,cursive;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.8);\">' + tr('rqSearching') + '</div>',\n        '<div style=\"width:85%;max-width:320px;height:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;border:1px solid rgba(255,255,255,.12);\"><div id=\"rqProgressBar\" style=\"height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#ff3d00,#ff7a00,#ffc400);background-size:200% 100%;animation:rq-bar-shine 1.4s linear infinite,rq-bar-grow 8s ease-in-out infinite alternate;box-shadow:0 0 12px rgba(255,140,0,.7);\"></div></div>',\n        '<style>@keyframes rq-bar-shine{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes rq-bar-grow{0%{width:8%}100%{width:92%}}</style>',\n        '<div id=\"rqSub\" style=\"font-size:12px;color:rgba(255,255,255,.65);font-weight:600;font-family:Fredoka,cursive;max-width:280px;line-height:1.4\">' + tr('rqSearchingSub') + '</div>',\n      '</div>'\n    ].join('');\n    document.body.appendChild(loadOv);\n    return loadOv;\n  }\n\n  function _raceShowSearching(){\n    const ov=_ensureLoadingOverlay();\n    ov.style.opacity='1'; ov.style.pointerEvents='all';\n    const sf=document.getElementById('raceStartFixed'); if(sf) sf.style.display='none';\n    const _bnav=document.querySelector('.bnav'); if(_bnav) _bnav.style.display='none';\n  }\n\n  function _raceHideSearching(){\n    const ov=document.getElementById('raceLoadingOv');\n    if(ov){ ov.style.opacity='0'; ov.style.pointerEvents='none'; }\n  }\n\n  function _raceRestoreSelectUI(){\n    _raceQueueing=false; _raceStarted=false;\n    _raceHideSearching();\n    const sf=document.getElementById('raceStartFixed'); if(sf) sf.style.display='block';\n    const _bnav=document.querySelector('.bnav'); if(_bnav) _bnav.style.display='';\n  }\n\n  function _raceDelay(ms){ return new Promise(r=>setTimeout(r,ms)); }\n\n  async function _racePollUntilResolved(maxMs=30000){\n    const end=Date.now()+maxMs;\n    while(Date.now()<end && _raceQueueing){\n      try{\n        const res=await api('racePoll',{});\n        if(res&&res.status==='matched'){\n          _raceStopPolling();\n          _raceLaunchMatch(res);\n          return true;\n        }\n        if(res&&res.status==='waiting'){\n          _raceStopPolling();\n          _racePollTimer=setInterval(_racePollOnce, 2000);\n          return true;\n        }\n      }catch(e){ console.warn('racePoll recover:',e.message); }\n      await _raceDelay(1500);\n    }\n    return false;\n  }\n\n  async function _raceCancel(){\n    _raceStopPolling();\n    try{\n      const res=await api('raceCancelQueue',{});\n      if(res){\n        if(typeof res.tonBalance==='number' && S?.user){\n          S.user.tonBalance=res.tonBalance; syncTopbar();\n        }\n        if(res.refunded!==false) { /* refund removed */ }\n      }\n    }catch(e){ console.warn('cancel:',e.message); }\n    _raceRestoreSelectUI();\n    try{ loadState(); }catch(_){}\n  }\n\n  function _raceShowOpponent(opp){\n    // Skip \"Match found\" display \u2014 go straight to race\n    return;\n    const sub=document.getElementById('rqSub');\n    if(sub) sub.textContent='\u0421\u043e\u043f\u0435\u0440\u043d\u0438\u043a \u043d\u0430\u0439\u0434\u0435\u043d! \u0413\u043e\u0442\u043e\u0432\u0438\u043c \u0442\u0440\u0430\u0441\u0441\u0443...';\n    const title=document.getElementById('rqTitle');\n    if(title) title.textContent='\u26a1 Match found';\n    const oppBox=document.getElementById('rqOpp');\n    const av=document.getElementById('rqOppAv');\n    const nm=document.getElementById('rqOppName');\n    const lv=document.getElementById('rqOppLv');\n    if(av){\n      if(opp.photoUrl){ av.innerHTML='<img src=\"'+opp.photoUrl+'\" style=\"width:100%;height:100%;object-fit:cover\" onerror=\"this.parentElement.textContent=\\'\ud83c\udfcd\ufe0f\\'\">'; }\n      else av.textContent='\ud83c\udfcd\ufe0f';\n    }\n    if(nm) nm.textContent='@'+(opp.username||opp.name||'rider').slice(0,18);\n    if(lv) lv.textContent='Level '+opp.lv;\n    if(oppBox){ oppBox.style.display='flex'; }\n  }\n\n  async function _raceLaunchMatch(matchData){\n    _raceStopPolling();\n    _raceQueueing=false;\n    const youAreP1=!!matchData.youAreP1;\n    const winnerSide = matchData.youWon ? (youAreP1?'p1':'p2') : (youAreP1?'p2':'p1');\n    const myLv=matchData.you.lv, oppLv=matchData.opp.lv;\n    _racePending={\n      playerWins: !!matchData.youWon,\n      p1Name: matchData.you.name||'You',\n      aiName: matchData.opp.name||'Opponent',\n      oppPhoto: matchData.opp.photoUrl||'',\n      maxPlayerKmh: matchData.you.maxKmh||120,\n      maxAiKmh: matchData.opp.maxKmh||120,\n      tonBalance: matchData.tonBalance,\n      prize: matchData.prize||0.9\n    };\n    if(typeof matchData.tonBalance==='number' && S?.user){\n      S.user.tonBalance=matchData.tonBalance; syncTopbar();\n    }\n    _raceShowOpponent(matchData.opp);\n    const selectPhase=document.getElementById('raceSelectPhase');\n    const animPhase=document.getElementById('raceAnimPhase');\n    const resultOv=document.getElementById('rsResultOverlay');\n    if(resultOv) resultOv.style.display='none';\n    const fr=document.getElementById('raceEngineFrame');\n    _raceReady=false;\n    const minLoadMs=1400; const startedAt=Date.now();\n    const showRace=()=>{\n      const wait=Math.max(0, minLoadMs-(Date.now()-startedAt));\n      setTimeout(()=>{\n        _raceHideSearching();\n        if(selectPhase) selectPhase.style.display='none';\n        if(animPhase) animPhase.style.display='block';\n        _raceActive=true;\n      }, wait);\n    };\n    _raceShowFn=showRace;\n    if(fr){\n      // youAreP1 \u2192 engine: car1 (left) is YOU. Else car2 (right) is YOU.\n      // Engine treats `player` as car1 (left) bike model, `ai` as car2 (right).\n      const leftLv  = youAreP1 ? myLv  : oppLv;\n      const rightLv = youAreP1 ? oppLv : myLv;\n      const p1Name  = youAreP1 ? (matchData.you.name||'You') : (matchData.opp.name||'Opponent');\n      const p2Name  = youAreP1 ? (matchData.opp.name||'Opponent') : (matchData.you.name||'You');\n      const p1Photo = youAreP1 ? (matchData.you.photoUrl||'') : (matchData.opp.photoUrl||'');\n      const p2Photo = youAreP1 ? (matchData.opp.photoUrl||'') : (matchData.you.photoUrl||'');\n      const p1MaxSpd= youAreP1 ? (matchData.you.maxKmh||120) : (matchData.opp.maxKmh||120);\n      const p2MaxSpd= youAreP1 ? (matchData.opp.maxKmh||120) : (matchData.you.maxKmh||120);\n      // Bike Level 0.glb exists \u2014 send real levels directly like all other levels\n      fr.src='race_engine.html?t='+Date.now()\n        +'&player='+leftLv+'&ai='+rightLv+'&winner='+winnerSide\n        +'&p1Name='+encodeURIComponent(p1Name)+'&p2Name='+encodeURIComponent(p2Name)\n        +'&p1Photo='+encodeURIComponent(p1Photo)+'&p2Photo='+encodeURIComponent(p2Photo)\n        +'&p1MaxSpd='+p1MaxSpd+'&p2MaxSpd='+p2MaxSpd;\n    }\n    setTimeout(()=>{ if(!_raceReady && _raceShowFn){ _raceReady=true; const f=_raceShowFn; _raceShowFn=null; f(); } }, 15000);\n  }\n\n  function _racePollOnce(){\n    api('racePoll',{}).then(res=>{\n      if(!res||!res.status) return;\n      if(res.status==='matched'){\n        _raceStopPolling();\n        _raceLaunchMatch(res);\n      } else if(res.status==='idle'){\n        // Server forgot us (TTL or external cancel). Reset UI.\n        _raceStopPolling();\n        _raceRestoreSelectUI();\n        if(res.refunded) { /* refund removed */ }\n        try{ loadState(); }catch(_){}\n      }\n    }).catch(e=>console.warn('racePoll:',e.message));\n  }\n\n  window.startRace = async function(){\n    if(_raceActive||_raceStarted||_raceQueueing) return;\n    if(_raceBikes.length===0){ showNotif('\u274c \u041d\u0435\u0442 \u0431\u0430\u0439\u043a\u043e\u0432! \u041a\u0443\u043f\u0438\u0442\u0435 \u0432 \u0413\u0430\u0440\u0430\u0436\u0435','e'); return; }\n    const _selBike=_raceBikes[_raceIdx];\n    if(_selBike && _selBike.lv===0){\n      const _fbLang=localStorage.getItem('pandaLang')||'en';\n      const _fbT=TRANSLATIONS[_fbLang]||TRANSLATIONS['en'];\n      showNotif(_fbT.freeBikeNotAllowed||'\ud83d\udeab This free bike is not allowed to race. Use a paid bike to race with others.','e');\n      return;\n    }\n    const ton=S?.user?.tonBalance||0;\n    if(ton<0.5){ showNotif('\u274c \u041d\u0443\u0436\u043d\u043e 0.5 TON \u0434\u043b\u044f \u0441\u0442\u0430\u0440\u0442\u0430','e'); return; }\n\n    _raceStarted=true; _raceQueueing=true;\n    _raceSelectedBike=_raceBikes[_raceIdx];\n    _raceShowSearching();\n\n    let res;\n    try{ res=await api('raceJoinQueue',{bikeLevel:_raceSelectedBike ? _raceSelectedBike.lv : 0}); }\n    catch(e){\n      // The server may have completed the match after the network timed out.\n      // Keep the loading screen open and verify by polling before showing an error.\n      const recovered=await _racePollUntilResolved(30000);\n      if(recovered) return;\n      _raceRestoreSelectUI();\n      showNotif('\u274c '+(e.message||'\u041e\u0448\u0438\u0431\u043a\u0430 \u0441\u0435\u0442\u0438'),'e'); return;\n    }\n    if(!res||!res.status){\n      const recovered=await _racePollUntilResolved(12000);\n      if(recovered) return;\n      _raceRestoreSelectUI();\n      showNotif('\u274c \u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0432\u043e\u0439\u0442\u0438 \u0432 \u043e\u0447\u0435\u0440\u0435\u0434\u044c','e'); return;\n    }\n    // Refresh balance display (entry fee deducted)\n    try{ loadState(); }catch(_){}\n\n    if(res.status==='matched'){\n      // Instant or previously unacknowledged match \u2014 pull full data via poll, then launch\n      _racePollOnce();\n    } else if(res.status==='waiting'){\n      // Waiting \u2192 poll every 2s and keep the loading screen open\n      _raceStopPolling();\n      _racePollTimer=setInterval(_racePollOnce, 2000);\n    } else {\n      _raceRestoreSelectUI();\n      showNotif('\u274c \u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0432\u043e\u0439\u0442\u0438 \u0432 \u043e\u0447\u0435\u0440\u0435\u0434\u044c','e');\n    }\n  };\n\n  /* Listen for race-engine messages */\n  window.addEventListener('message',function(ev){\n    const d=ev.data||{};\n    if(d.type==='race-ready'){\n      if(!_raceReady && _raceShowFn){ _raceReady=true; const f=_raceShowFn; _raceShowFn=null; f(); }\n    }\n    else if(d.type==='race-back'){ window.raceGoBack(); }\n    else if(d.type==='race-finished' && _racePending){\n      const p=_racePending;\n      setTimeout(()=>_showResult(p.playerWins,p.p1Name,p.aiName,p.maxPlayerKmh,p.maxAiKmh,p.oppPhoto),400);\n    }\n  });\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     RESULT OVERLAY\n  \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  function _showResult(playerWins,p1Name,aiName,p1Kmh,p2Kmh,oppPhoto){\n    const ov=document.getElementById('rsResultOverlay');\n    if(!ov)return;\n    const title=document.getElementById('rsrTitle');\n    const reward=document.getElementById('rsrReward');\n    const rewTxt=document.getElementById('rsrRewardTxt');\n    const av1=document.getElementById('rsrAv1');\n    const name1=document.getElementById('rsrName1');\n    const spd1=document.getElementById('rsrSpd1');\n    const av2=document.getElementById('rsrAv2');\n    const name2=document.getElementById('rsrName2');\n    const spd2=document.getElementById('rsrSpd2');\n    const side1=document.getElementById('rsrSide1');\n    const side2=document.getElementById('rsrSide2');\n    if(playerWins){\n      if(title){title.textContent='\u041f\u043e\u0431\u0435\u0434\u0430!';title.className='rsr-title win';}\n      if(reward)reward.style.display='flex';\n      if(rewTxt)rewTxt.textContent='+'+((_racePending&&_racePending.prize)||0.9)+' TON';\n      if(side1){side1.classList.add('winner-side');}\n      if(side2){side2.classList.remove('winner-side');}\n    }else{\n      if(title){title.textContent='\u041f\u0440\u043e\u0438\u0433\u0440\u044b\u0448';title.className='rsr-title lose';}\n      if(reward)reward.style.display='none';\n      if(side2){side2.classList.add('winner-side');}\n      if(side1){side1.classList.remove('winner-side');}\n    }\n    const tgUser=S?.tg?.initDataUnsafe?.user;\n    if(tgUser?.photo_url){\n      if(av1)av1.innerHTML='<img src=\"'+tgUser.photo_url+'\" onerror=\"this.parentElement.textContent=\\'\ud83c\udfcd\ufe0f\\'\">';\n    }else{if(av1)av1.textContent='\ud83c\udfcd\ufe0f';}\n    if(av2){\n      if(oppPhoto){ av2.innerHTML='<img src=\"'+oppPhoto+'\" onerror=\"this.parentElement.textContent=\\'\ud83c\udfcd\ufe0f\\'\">'; }\n      else av2.textContent='\ud83c\udfcd\ufe0f';\n    }\n    if(name1)name1.textContent='@'+p1Name;\n    if(name2)name2.textContent='@'+aiName;\n    const myBike=_racePending?.p1Name||'';\n    const oppBike=_racePending?.aiName||'';\n    if(spd1)spd1.textContent=p1Kmh+' km/h';\n    if(spd2)spd2.textContent=p2Kmh+' km/h';\n    ov.style.display='flex';\n    // Acknowledge match server-side so the record can be cleaned up\n    api('raceAck',{}).catch(()=>{});\n    setTimeout(()=>{try{loadState();}catch(e){}},1200);\n  }\n\n  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n     BACK TO SELECTION\n  \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n  window.raceGoBack=function(){\n    _raceStopPolling();\n    _raceActive=false;_raceStarted=false;_raceQueueing=false;_racePending=null;\n    const ov=document.getElementById('rsResultOverlay');\n    if(ov)ov.style.display='none';\n    const fr=document.getElementById('raceEngineFrame');\n    if(fr)fr.src='about:blank';\n    const animPhase=document.getElementById('raceAnimPhase');\n    const selectPhase=document.getElementById('raceSelectPhase');\n    if(animPhase)animPhase.style.display='none';\n    if(selectPhase)selectPhase.style.display='block';\n    const sf=document.getElementById('raceStartFixed');\n    if(sf)sf.style.display='block';\n    const _bnav=document.querySelector('.bnav');\n    if(_bnav)_bnav.style.display='';\n    _raceInit();\n  };\n\n  window._raceRefreshIfActive=function(){\n    const sec=document.getElementById('sectionTasks');\n    if(sec&&sec.classList.contains('active'))window._raceInit();\n  };\n\n})();\n"}, {"type": "inline", "code": "\n    // \u2500\u2500 REF2 STATE \u2500\u2500\n    window._ref2TypeFilter = 'all';\n    window._ref2DateDays   = 7;\n\n    function switchRef2Tab(el, tab){\n      document.querySelectorAll('.ref2-stab').forEach(x=>x.classList.remove('active'));\n      el.classList.add('active');\n      document.getElementById('ref2-cont-friends').style.display  = tab==='friends'  ? 'block' : 'none';\n      document.getElementById('ref2-cont-missions').style.display = tab==='missions' ? 'block' : 'none';\n      // Hide commission card + stats + filters on missions tab\n      const commCard = document.querySelector('.ref2-commission-card');\n      const statsGrid = document.querySelector('.ref2-stats-grid');\n      if(commCard) commCard.style.display = tab==='missions' ? 'none' : '';\n      if(statsGrid) statsGrid.style.display = tab==='missions' ? 'none' : '';\n      if(tab==='missions') renderRefMissions();\n    }\n\n    function toggleRef2Dropdown(which){\n      event.stopPropagation();\n      const typeD = document.getElementById('ref2TypeDropdown');\n      const dateD = document.getElementById('ref2DateDropdown');\n      const typeBtn = document.getElementById('ref2TypeFilterBtn');\n      const dateBtn = document.getElementById('ref2DateFilterBtn');\n\n      function positionDropdown(dropdown, btn){\n        const rect = btn.getBoundingClientRect();\n        dropdown.style.top  = (rect.bottom + 5) + 'px';\n        dropdown.style.left = rect.left + 'px';\n        dropdown.style.width = rect.width + 'px';\n      }\n\n      if(which==='type'){\n        const open = typeD.classList.contains('open');\n        dateD.classList.remove('open');\n        dateD.style.display = 'none';\n        if(!open){ positionDropdown(typeD, typeBtn); typeD.style.display='block'; typeD.classList.add('open'); }\n        else { typeD.style.display='none'; typeD.classList.remove('open'); }\n      } else {\n        const open = dateD.classList.contains('open');\n        typeD.classList.remove('open');\n        typeD.style.display = 'none';\n        if(!open){ positionDropdown(dateD, dateBtn); dateD.style.display='block'; dateD.classList.add('open'); }\n        else { dateD.style.display='none'; dateD.classList.remove('open'); }\n      }\n    }\n\n    document.addEventListener('click', function(){\n      ['ref2TypeDropdown','ref2DateDropdown'].forEach(id=>{\n        const el=document.getElementById(id);\n        if(el){ el.classList.remove('open'); el.style.display='none'; }\n      });\n    });\n\n    function setRef2TypeFilter(el, val){\n      event.stopPropagation();\n      window._ref2TypeFilter = val;\n      document.querySelectorAll('#ref2TypeDropdown .ref2-filter-opt').forEach(x=>x.classList.remove('active'));\n      el.classList.add('active');\n      document.getElementById('ref2TypeLabel').textContent = el.innerText.replace('\u2713','').trim().split('\\n')[0].trim();\n      const d=document.getElementById('ref2TypeDropdown'); d.classList.remove('open'); d.style.display='none';\n      renderRef2List();\n    }\n\n    function setRef2DateFilter(el, days, label){\n      event.stopPropagation();\n      window._ref2DateDays = days;\n      document.querySelectorAll('#ref2DateDropdown .ref2-filter-opt').forEach(x=>x.classList.remove('active'));\n      el.classList.add('active');\n      document.getElementById('ref2DateLabel').textContent = label;\n      const d=document.getElementById('ref2DateDropdown'); d.classList.remove('open'); d.style.display='none';\n      renderRef2List();\n    }\n\n    function renderRef2List(){\n      const TON_ICON = '<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463497/toncoin-ton-logo_vpeeux.png\" style=\"width:15px;height:15px;border-radius:50%;object-fit:cover\">';\n      const listEl = document.getElementById('ref2FriendsList');\n      if(!listEl) return;\n      let refs = S.refs || [];\n\n      // Date filter\n      if(window._ref2DateDays > 0){\n        const cutoff = Date.now() - window._ref2DateDays * 86400000;\n        refs = refs.filter(r=>{\n          if(!r.date) return true;\n          const d = new Date(r.date);\n          return isNaN(d.getTime()) ? true : d.getTime() >= cutoff;\n        });\n      }\n\n      // Type filter\n      if(window._ref2TypeFilter === 'active')   refs = refs.filter(r=>r.hasWithdrawn);\n      else if(window._ref2TypeFilter === 'inactive') refs = refs.filter(r=>!r.hasWithdrawn);\n      else if(window._ref2TypeFilter === 'top')  refs = [...refs].sort((a,b)=>(b.earned||0)-(a.earned||0));\n\n      if(!refs.length){\n        listEl.innerHTML = '<div class=\"ref2-empty\">No referrals found</div>';\n        return;\n      }\n\n      listEl.innerHTML = refs.slice(0,30).map(r=>`\n        <div class=\"ref2-list-item\">\n          <div class=\"ref2-av\">${r.photo?`<img src=\"${esc(r.photo)}\" onerror=\"this.parentElement.innerHTML='\ud83c\udfcd\ufe0f'\">` :'\ud83c\udfcd\ufe0f'}</div>\n          <div class=\"ref2-li-info\">\n            <div class=\"ref2-li-name\">${esc(r.name||'Friend')}</div>\n            <div class=\"ref2-li-date\">${esc(r.date||'Joined recently')}</div>\n          </div>\n          <div class=\"ref2-li-earn\">+${(parseFloat(r.earned||0)).toFixed(4).replace(/\\.?0+$/,'')||'0'} ${TON_ICON}</div>\n        </div>`).join('');\n    }\n\n    function updateRef2Stats(){\n      const refs = S.refs || [];\n      const total    = refs.length;\n      const active   = refs.filter(r=>r.hasWithdrawn).length;\n      const inactive = total - active;\n      const totalEarned = refs.reduce((s,r)=>s+(r.earned||0),0);\n\n      const t = document.getElementById('ref2TotalCount');\n      const a = document.getElementById('ref2ActiveCount');\n      const i = document.getElementById('ref2InactiveCount');\n      const e = document.getElementById('ref2TotalEarned');\n      if(t) t.textContent = total;\n      if(a) a.textContent = active;\n      if(i) i.textContent = inactive;\n      if(e) e.textContent = totalEarned.toFixed(4);\n\n      // Also update the old badge used elsewhere\n      const cntEl = document.getElementById('totalRefsDisp');\n      if(cntEl) cntEl.textContent = `${total} Friends`;\n      // Also fill the link input\n      const link=`${CFG.BOT_APP_LINK}?startapp=${encodeURIComponent(S.userId||'000')}`;\n      const refEl=document.getElementById('refLinkInp');\n      if(refEl) refEl.value=link;\n    }\n    "}, {"type": "inline", "code": "\nconst MISSION_DEFS = {\n  BIKE: [\n    { id:'bt5',  img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463406/a6e1f249-2926-4231-81e1-47695cee3c31_ffewqu.png', title:'Buy 5 Bikes',  desc:'Purchase 5 bikes total',  reward:2,   total:5  },\n    { id:'bt10', img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463446/ce6ec367-7bc4-4af0-8976-9b3ad40b6296_xyzmwq.png', title:'Buy 10 Bikes', desc:'Purchase 10 bikes total', reward:20,  total:10 },\n  ],\n  RACE: [\n    { id:'rc10', img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463370/08592d1d-6703-4ab9-b9ce-8ac5e00e6613_bf0y04.png', title:'10 Races',   desc:'Race 10 times',   reward:0.5, total:10 },\n    { id:'rc20', img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463364/6064c98e-cd0a-4fc9-98a6-bfa3d35ec219_zcpd0d.png', title:'20 Races',   desc:'Race 20 times',   reward:1,   total:20 },\n    { id:'rc50', img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463436/bc375662-249d-4a27-8e0b-182995c4aa6d_y5omjw.png', title:'50 Races',   desc:'Race 50 times',   reward:3,   total:50 },\n    { id:'rc100',img:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463501/d2dbe6bf-92f5-4ed9-ae62-833692f8f217_daxeoz.png', title:'100 Races',  desc:'Race 100 times',  reward:6,   total:100},\n  ],\n};\n\nconst REF_MISSION_DEFS = [\n  { id:'rt10',   n:10,   ton:0.1,  icon:'\ud83d\udc65' },\n  { id:'rt50',   n:50,   ton:0.5,  icon:'\ud83d\udc65' },\n  { id:'rt100',  n:100,  ton:1,    icon:'\ud83d\udc65' },\n  { id:'rt200',  n:200,  ton:2,    icon:'\ud83d\udc65' },\n  { id:'rt500',  n:500,  ton:5,    icon:'\ud83d\udc65' },\n  { id:'rt1000', n:1000, ton:10,   icon:'\ud83c\udfc6' },\n];\n\nconst MISSIONS_CARD_BG = \"url('https://res.cloudinary.com/dktppfipy/image/upload/v1778463452/d4b8ff57-cd92-4a86-a1ff-dfe4e8c022e6_uffaeo.png')\";\n\n\n\nfunction renderRefMissions(){\n  const completedTasks = S.doneTasks || [];\n  const activeRefs = (S.refs||[]).filter(r=>r.hasWithdrawn).length;\n  const el = document.getElementById('refMissionsList');\n  if(!el) return;\n\n  const MISSION_IMGS = {\n    'rt10':  'https://res.cloudinary.com/dktppfipy/image/upload/v1778463374/526844fa-1d9a-48bd-a3fb-580ef3ff33f2_dtb8ie.jpg',\n    'rt50':  'https://res.cloudinary.com/dktppfipy/image/upload/v1778463284/2bbf18f9-c70f-4efd-b688-ec3473c600cb_bmjjp9.jpg',\n    'rt100': 'https://res.cloudinary.com/dktppfipy/image/upload/v1778463284/01c40a72-9880-42ae-8f57-19c2c21108db_kluota.jpg',\n    'rt200': 'https://res.cloudinary.com/dktppfipy/image/upload/v1778463358/3944d4e9-a95c-462a-ac04-8b86ad32ccb9_ztsopu.jpg',\n    'rt500': 'https://res.cloudinary.com/dktppfipy/image/upload/v1778463369/18746e47-31d7-49e5-b676-4d7f6be92d8f_ved12b.jpg',\n    'rt1000':'https://res.cloudinary.com/dktppfipy/image/upload/v1778463434/b137bd77-2403-42c8-8183-cb4a25c93cd1_kignzt.jpg',\n  };\n  const PAGE_BG = \"url('https://res.cloudinary.com/dktppfipy/image/upload/v1778463296/4d98081c-dfab-4d8c-b6c2-09701c151362_yr3pym.png')\";\n\n  el.innerHTML = REF_MISSION_DEFS.map(m=>{\n    const done = completedTasks.includes(m.id);\n    const prog = Math.min(activeRefs, m.n);\n    const pct  = Math.round(prog/m.n*100);\n    const canClaim = !done && activeRefs >= m.n;\n    const img = MISSION_IMGS[m.id] || '';\n    const cardBG = img ? `url('${img}')` : PAGE_BG;\n    return `\n      <div style=\"\n        border:1.5px solid rgba(199,125,255,.25);border-radius:16px;\n        display:flex;align-items:center;gap:0;margin-bottom:10px;overflow:hidden;\n        background-image:linear-gradient(rgba(0,0,0,.68),rgba(0,0,0,.78)),${cardBG};\n        background-size:cover;background-position:center;\n        \n      \">\n        <!-- Big image left -->\n        <div style=\"width:100px;height:100px;flex-shrink:0;overflow:hidden;border-radius:14px;margin:8px;box-shadow:0 4px 16px rgba(0,0,0,.6)\">\n          <img src=\"${img}\" style=\"width:100%;height:100%;object-fit:cover;border-radius:14px\" onerror=\"this.style.display='none'\">\n        </div>\n        <!-- Info -->\n        <div style=\"flex:1;padding:10px 8px 10px 0;min-width:0\">\n          <div style=\"font-size:13px;font-weight:800;color:#fff;margin-bottom:1px\">Invite ${m.n} Active Users</div>\n          <div style=\"font-size:11px;font-weight:800;color:#00D4FF;display:flex;align-items:center;gap:4px;margin-bottom:7px\">\n            <img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463497/toncoin-ton-logo_vpeeux.png\" style=\"width:14px;height:14px;border-radius:50%\"> +${m.ton} TON\n          </div>\n          <div style=\"height:7px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin-bottom:4px;border:1px solid rgba(255,255,255,.06)\">\n            <div style=\"height:100%;width:${pct}%;background:linear-gradient(90deg,#C77DFF,#a040ff);border-radius:4px;transition:width .4s\"></div>\n          </div>\n          <div style=\"font-size:9px;color:rgba(255,255,255,.5);font-weight:700\">${prog}/${m.n} active</div>\n        </div>\n        <!-- Button -->\n        <div style=\"flex-shrink:0;padding:10px 10px 10px 4px\">\n          ${done\n            ? '<div style=\"background:rgba(0,242,122,.14);border:1px solid rgba(0,242,122,.3);border-radius:10px;padding:7px 11px;font-size:11px;font-weight:800;color:#00F27A\">\u2705 Done</div>'\n            : canClaim\n              ? `<button onclick=\"claimRefMission('${m.id}')\" style=\"background:linear-gradient(135deg,#9D5CFF,#6a0dad);border:none;border-radius:10px;padding:8px 13px;color:#fff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 0 12px rgba(157,92,255,.5)\">\ud83c\udf81 Claim</button>`\n              : '<div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;color:rgba(255,255,255,.3)\">\ud83d\udd12</div>'\n          }\n        </div>\n      </div>`;\n  }).join('');\n}\n\nasync \n\nasync \n\n\n\nasync \n\n\n\nfunction syncFinanceHeader(){\n  const user = S.user||{};\n  const tonBal = user.tonBalance||0;\n  const el = document.getElementById('finTonBal');\n  if(el) el.textContent = tonBal.toFixed(4);\n  const wdEl = document.getElementById('wdTonBal');\n  if(wdEl) wdEl.textContent = tonBal.toFixed(4);\n  // User photo\n  const avEl = document.getElementById('finUserAvatar');\n  if(avEl && user.photoUrl){\n    avEl.innerHTML = `<img src=\"${user.photoUrl}\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%\">`;\n  }\n  const nameEl = document.getElementById('finUserName');\n  if(nameEl){\n    const name = user.firstName||(S._tgName)||'Player';\n    nameEl.textContent = name;\n  }\n  const handleEl = document.getElementById('finUserHandle');\n  if(handleEl){\n    handleEl.textContent = user.username?`@${user.username}`:'';\n  }\n  // Lang flags on profile page \u2014 read from localStorage (reliable source of truth)\n  const savedFlag = localStorage.getItem('pandaLangFlag')||'\ud83c\uddec\ud83c\udde7';\n  const savedCode = localStorage.getItem('pandaLangCode')||'EN';\n  const langFl = document.getElementById('langFlagFin');\n  const langLbl = document.getElementById('langLblFin');\n  if(langFl) langFl.textContent = savedFlag;\n  if(langLbl) langLbl.textContent = savedCode;\n}\n"}, {"type": "inline", "code": "\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   CONFIG \u2014 \ud83d\udd27 edit these before deploying\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst CFG = {\n  API_URL      : 'https://rassen-production-9490.up.railway.app', // \u270f\ufe0f \u0636\u0639 \u0631\u0627\u0628\u0637 Workers \u0647\u0646\u0627\n  DEPOSIT_WALLET:'UQCnp8fKd88hS86txAfND_Xy9Iqiz2p0OsKn6KghCKGCw83T',\n  MIN_WD_TON   : 0.0001,\n  REF_BONUS    : 10,\n  BOT_USERNAME : 'RaseenRacing_bot',\n  BOT_APP_LINK : 'https://t.me/RaseenRacing_bot/app',\n};\n\n/* \u2550\u2550\u2550\u2550 MULTI-SERVER RACE SYSTEM \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   On first load: race all servers \u2192 fastest wins.\n   Winner stored in sessionStorage for the whole session.\n   If sticky server fails \u2192 re-race automatically.\n   Dead servers skipped for DEAD_WINDOW_MS before retry.\n   SECURITY: write ops (withdraw, exchange, buy) go to ONE server only.\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst SERVERS = [\n  'https://rassen-production-9490.up.railway.app', // \u270f\ufe0f \u0636\u0639 \u0631\u0627\u0628\u0637 Railway \u0647\u0646\u0627 (\u0646\u0641\u0633 CFG.API_URL)\n];\n\n// Actions that MUST go to ONE server only (write ops \u2014 prevent double execution)\nconst WRITE_ACTIONS = new Set([\n  'withdraw','exchange','buy','upgradeTank','collect',\n  'claimTask','verifyTask','createTask','deposit',\n  'buyBike','upgradeStats','race','raceResult','raceJoinQueue','raceCancelQueue','raceAck','startBikeMining','claimBikeMining','saveLanguage','verifyForcedSubscription'\n]);\n\nconst API_TIMEOUT_MS  = 8000;\nconst API_ACTION_TIMEOUT_MS = {\n  raceJoinQueue: 30000,\n  racePoll: 12000,\n  raceCancelQueue: 15000,\n  raceAck: 12000,\n  buyBike: 20000,\n  upgradeStats: 20000,\n  withdraw: 20000,\n  getContests: 30000,\n  verifyForcedSubscription: 20000\n};\nfunction _timeoutForAction(action){ return API_ACTION_TIMEOUT_MS[action] || API_TIMEOUT_MS; }\nconst DEAD_WINDOW_MS  = 12 * 60 * 60 * 1000; // 12h\nconst SESS_KEY        = 'panda_active_srv';\nconst DEAD_KEY        = 'panda_dead_srvs';\n\nfunction _getDeadMap(){\n  try{ return JSON.parse(sessionStorage.getItem(DEAD_KEY)||'{}'); }catch(_){ return {}; }\n}\nfunction _markDead(url){\n  const m=_getDeadMap(); m[url]=Date.now();\n  try{ sessionStorage.setItem(DEAD_KEY,JSON.stringify(m)); }catch(_){}\n}\nfunction _isDead(url){\n  const m=_getDeadMap(); const t=m[url];\n  return t && (Date.now()-t < DEAD_WINDOW_MS);\n}\nfunction _getStickyServer(){\n  try{ return sessionStorage.getItem(SESS_KEY)||null; }catch(_){ return null; }\n}\nfunction _setStickyServer(url){\n  try{ sessionStorage.setItem(SESS_KEY,url); }catch(_){}\n}\n\nasync function _callOne(url, action, data, authHdr){\n  const heads = {'Content-Type':'application/json'};\n  if(authHdr) heads.Authorization = authHdr;\n  const ctrl = new AbortController();\n  const tOut = setTimeout(()=>ctrl.abort(), _timeoutForAction(action));\n  try{\n    const r = await fetch(`${url}/api`,{method:'POST',headers:heads,body:JSON.stringify({action,data}),signal:ctrl.signal});\n    clearTimeout(tOut);\n    if(!r.ok) throw new Error(`HTTP ${r.status}`);\n    return await r.json();\n  }catch(e){ clearTimeout(tOut); throw e; }\n}\n\n// Race all live servers \u2014 used only for read ops at startup\nasync function _raceServers(action, data, authHdr){\n  const live = SERVERS.filter(s=>!_isDead(s));\n  if(!live.length){ // all dead \u2014 reset and try all\n    try{ sessionStorage.removeItem(DEAD_KEY); }catch(_){}\n    live.push(...SERVERS);\n  }\n  return new Promise((resolve, reject)=>{\n    let done=false, fails=0;\n    live.forEach(url=>{\n      _callOne(url, action, data, authHdr)\n        .then(res=>{\n          if(done) return;\n          done=true;\n          _setStickyServer(url);\n          resolve(res);\n        })\n        .catch(()=>{\n          _markDead(url);\n          fails++;\n          if(fails===live.length && !done) reject(new Error('All servers unreachable'));\n        });\n    });\n  });\n}\n\n// Route call: write ops \u2192 sticky server only; read ops \u2192 sticky or race\nasync function _call(url/*ignored*/, action, data, authHdr){\n  const isWrite = WRITE_ACTIONS.has(action);\n  const sticky  = _getStickyServer();\n\n  if(isWrite){\n    // Write ops MUST use sticky server to prevent duplicate execution\n    const srv = sticky || SERVERS[0];\n    return _callOne(srv, action, data, authHdr);\n  }\n\n  // Read op: try sticky first, fall back to race\n  if(sticky && !_isDead(sticky)){\n    try{\n      const res = await _callOne(sticky, action, data, authHdr);\n      return res;\n    }catch(e){\n      _markDead(sticky);\n      try{ sessionStorage.removeItem(SESS_KEY); }catch(_){}\n    }\n  }\n  // Race to find fastest live server\n  return _raceServers(action, data, authHdr);\n}\n\n// Exposed for loading screen to race servers explicitly at startup\nwindow._raceServersNow = async function(authHdr){\n  return _raceServers('ping', {}, authHdr).catch(()=>\n    _raceServers('getState', {start_param:'',_initData:''}, authHdr)\n  );\n};\n\nconst BAM_URL='https://res.cloudinary.com/dktppfipy/image/upload/v1778463455/d7e19f8c-7876-4dc6-8542-d4f615704e46_mgohjd.png';\n\n// Fix 4: rebalanced items \u2014 clear ROI progression, higher tier always better per coin\nconst ITEMS = [\n  {id:'raseen_stick',   name:'Raseen Stick',       icon:'img', iconUrl:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463413/a995343f-ab46-4c91-9cf2-1140c0bdd6f5_uvnrzg.png',  price:7500,    power:50    },\n  {id:'panda_paw',      name:'Raseen Paw Drill',    icon:'img', iconUrl:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463492/f8d2d332-fa72-447e-94e9-62f4e5cf75c9_mw4ygh.png',  price:25000,   power:200   },\n  {id:'leaf_fan',       name:'Leaf Fan Cooler',    icon:'img', iconUrl:'https://res.cloudinary.com/dktppfipy/image/upload/v1778463444/c1657ae3-3927-41e9-a32d-70ab89ddfe3b_z3xj3a.png',  price:125000,  power:1200  },\n  {id:'raseen_energy',  name:'Raseen Energy Pod',  icon:'img', iconUrl:'',  price:625000,  power:7500  },\n  {id:'panda_den',      name:'Raseen Den Hub',      icon:'img', iconUrl:'',  price:3130000, power:45000 },\n  {id:'raseen_forest',  name:'Raseen Forest Rig',  icon:'img', iconUrl:'',  price:6500000, power:110000},\n];\n// 27 tank levels \u2014 capacity only, no speedBonus\nconst TANK_LVS = {\n  1 :{cap:5000,      upgCost:1000,       label:'Starter Tank'},\n  2 :{cap:10000,     upgCost:3000,       label:'Leaf Tank'},\n  3 :{cap:20000,     upgCost:8000,       label:'Raseen Tank'},\n  4 :{cap:40000,     upgCost:20000,      label:'Raseen Tank'},\n  5 :{cap:80000,     upgCost:50000,      label:'Mega Tank'},\n  6 :{cap:150000,    upgCost:120000,     label:'Empire Tank'},\n  7 :{cap:250000,    upgCost:250000,     label:'Forest Tank'},\n  8 :{cap:400000,    upgCost:450000,     label:'Giant Tank'},\n  9 :{cap:600000,    upgCost:750000,     label:'Legend Tank'},\n  10:{cap:900000,    upgCost:1200000,    label:'Titan Tank'},\n  11:{cap:1300000,   upgCost:1800000,    label:'Storm Tank'},\n  12:{cap:1800000,   upgCost:2700000,    label:'Thunder Tank'},\n  13:{cap:2500000,   upgCost:4000000,    label:'Volcano Tank'},\n  14:{cap:3300000,   upgCost:5500000,    label:'Glacier Tank'},\n  15:{cap:4300000,   upgCost:8000000,    label:'Aurora Tank'},\n  16:{cap:5500000,   upgCost:11000000,   label:'Nova Tank'},\n  17:{cap:7000000,   upgCost:15000000,   label:'Cosmic Tank'},\n  18:{cap:8800000,   upgCost:20000000,   label:'Galaxy Tank'},\n  19:{cap:11000000,  upgCost:27000000,   label:'Nebula Tank'},\n  20:{cap:14000000,  upgCost:35000000,   label:'Supernova Tank'},\n  21:{cap:17500000,  upgCost:45000000,   label:'Quantum Tank'},\n  22:{cap:22000000,  upgCost:58000000,   label:'Infinity Tank'},\n  23:{cap:28000000,  upgCost:75000000,   label:'Eternal Tank'},\n  24:{cap:35000000,  upgCost:95000000,   label:'Celestial Tank'},\n  25:{cap:44000000,  upgCost:120000000,  label:'Divine Tank'},\n  26:{cap:55000000,  upgCost:150000000,  label:'Absolute Tank'},\n  27:{cap:70000000,  upgCost:200000000,  label:'Universe Tank'},\n};\n// Fix 5: Added r200 + r500 \u2014 rewards reduced to 10% of original\nconst REF_TASKS=[\n  {id:'r1',  n:1,   bam:50,    coins:2   },\n  {id:'r5',  n:5,   bam:250,   coins:10  },\n  {id:'r10', n:10,  bam:600,   coins:25  },\n  {id:'r20', n:20,  bam:1500,  coins:60  },\n  {id:'r50', n:50,  bam:4000,  coins:150 },\n  {id:'r70', n:70,  bam:6000,  coins:220 },\n  {id:'r100',n:100, bam:10000, coins:400 },\n  {id:'r200',n:200, bam:20000, coins:800 },\n  {id:'r500',n:500, bam:50000, coins:2000},\n];\n// Active referrals (who deposited) \u2014 2x original rewards\nconst REF_ACTIVE_TASKS=[\n  {id:'ra1',  n:1,   bam:5000,    coins:20   },\n  {id:'ra5',  n:5,   bam:25000,   coins:100  },\n  {id:'ra10', n:10,  bam:60000,   coins:250  },\n  {id:'ra20', n:20,  bam:150000,  coins:600  },\n  {id:'ra50', n:50,  bam:400000,  coins:1500 },\n  {id:'ra70', n:70,  bam:600000,  coins:2200 },\n  {id:'ra100',n:100, bam:1000000, coins:4000 },\n  {id:'ra200',n:200, bam:2000000, coins:8000 },\n  {id:'ra500',n:500, bam:5000000, coins:20000},\n];\nconst SOC_TASKS=[\n  {id:'tg_payouts', name:'\ud83d\udcb0 Join Payouts Channel', icon:'\ud83d\udcb0', link:'https://t.me/RaseenRacing_bot', bam:1000},\n  {id:'tg_news',    name:'\ud83d\udcf0 Join Mining News Channel', icon:'\ud83d\udcf0', link:'https://t.me/RaseenRacing_bot', bam:500},\n  {id:'tg_ch', name:'Join Telegram Channel', icon:'\ud83d\udce2', link:'https://t.me/YOUR_CHANNEL', bam:1000},\n  {id:'tg_grp',name:'Join Telegram Group',   icon:'\ud83d\udc65', link:'https://t.me/YOUR_GROUP',   bam:500 },\n  {id:'tg_bot',name:'Start our Bot',          icon:'\ud83e\udd16', link:`https://t.me/${CFG.BOT_USERNAME}`, bam:300},\n];\n\n/* \u2550\u2550\u2550\u2550 STATE \u2550\u2550\u2550\u2550 */\nconst S={\n  userId:null,\n  startParam:'',\n  user:{coins:0,totalEarned:0,hasDeposited:false,tonBalance:0,ownedBikes:[],bikeUpgrades:{},bikeMining:{}},\n  refs:[],wdHist:[],balLog:[],doneTasks:[],\n  tasks:{partner:[],community:[]},\n  tg:null,tonUI:null,wallet:null,depCheckInt:null,\n};\ntry{window.S=S;}catch(_){ }\n\n/* \u2550\u2550\u2550\u2550 SECURITY: escape HTML to prevent XSS \u2550\u2550\u2550\u2550 */\nfunction esc(s){\n  return String(s||'')\n    .replace(/&/g,'&amp;')\n    .replace(/</g,'&lt;')\n    .replace(/>/g,'&gt;')\n    .replace(/\"/g,'&quot;')\n    .replace(/'/g,'&#39;');\n}\n\n/* \u2550\u2550\u2550\u2550 DEVICE FINGERPRINT \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Generates a stable hardware-based ID that survives:\n   \u2713 IP change / VPN\n   \u2713 Incognito mode\n   \u2713 Clearing cookies/cache\n   Based on: GPU, screen, fonts, audio, canvas, hardware concurrency\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nasync function getDeviceFingerprint(){\n  try{\n    const parts=[];\n    // 1. Canvas fingerprint\n    try{\n      const c=document.createElement('canvas');\n      const ctx=c.getContext('2d');\n      ctx.textBaseline='top';\n      ctx.font='14px Arial';\n      ctx.fillStyle='#f60';ctx.fillRect(125,1,62,20);\n      ctx.fillStyle='#069';ctx.fillText('\ud83c\udfcd\ufe0fRaseen',2,15);\n      ctx.fillStyle='rgba(102,204,0,0.7)';ctx.fillText('\ud83c\udfcd\ufe0fRaseen',4,17);\n      parts.push(c.toDataURL());\n    }catch(_){}\n    // 2. WebGL GPU fingerprint\n    try{\n      const c=document.createElement('canvas');\n      const gl=c.getContext('webgl')||c.getContext('experimental-webgl');\n      if(gl){\n        const dbg=gl.getExtension('WEBGL_debug_renderer_info');\n        if(dbg){\n          parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));\n          parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));\n        }\n        parts.push(gl.getParameter(gl.VERSION));\n        parts.push(gl.getParameter(gl.SHADING_LANGUAGE_VERSION));\n      }\n    }catch(_){}\n    // 3. Screen & hardware\n    parts.push(`${screen.width}x${screen.height}x${screen.colorDepth}`);\n    parts.push(`${navigator.hardwareConcurrency||0}cores`);\n    parts.push(`${navigator.deviceMemory||0}gb`);\n    parts.push(navigator.platform||'');\n    parts.push(navigator.language||'');\n    // 4. Audio fingerprint\n    try{\n      const AudioCtx=window.OfflineAudioContext||window.webkitOfflineAudioContext;\n      if(AudioCtx){\n        const ac=new AudioCtx(1,44100,44100);\n        const osc=ac.createOscillator();\n        const analyser=ac.createAnalyser();\n        const gain=ac.createGain();\n        gain.gain.value=0;\n        osc.connect(analyser);analyser.connect(gain);gain.connect(ac.destination);\n        osc.start(0);\n        const buf=await ac.startRendering();\n        const data=buf.getChannelData(0);\n        let sum=0;for(let i=0;i<data.length;i+=100)sum+=Math.abs(data[i]);\n        parts.push(sum.toFixed(6));\n      }\n    }catch(_){}\n    // 5. Timezone\n    parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone||'');\n    parts.push(new Date().getTimezoneOffset());\n    // Add Telegram userId as a stable anchor \u2014 same person, same ID across TG apps\n    if(S.userId) parts.push('tguid:'+S.userId);\n    // Hash everything into a stable 40-char hex string\n    const raw=parts.join('|||');\n    const enc=new TextEncoder();\n    const hashBuf=await crypto.subtle.digest('SHA-256',enc.encode(raw));\n    const hex=[...new Uint8Array(hashBuf)].map(b=>b.toString(16).padStart(2,'0')).join('');\n    return hex;\n  }catch(e){\n    console.warn('Fingerprint error:',e);\n    return '';\n  }\n}\n// Compute once and cache\nlet _fp='';\nasync function getOrComputeFp(){\n  if(_fp) return _fp;\n  _fp=await getDeviceFingerprint();\n  return _fp;\n}\n\n/* \u2550\u2550\u2550\u2550 ANTI-CLICKER DEBOUNCE SYSTEM \u2550\u2550\u2550\u2550 */\nconst _debounceMap = new Map();\n/* \u2500\u2500 Global button cooldown: disable ALL buttons for 6s after any API action \u2500\u2500 */\nlet _globalBtnCooldown = false;\nlet _globalCooldownTimer = null;\n\n// MutationObserver: disable any new buttons added while cooldown is active\nconst _cooldownObserver = new MutationObserver((mutations)=>{\n  if(!_globalBtnCooldown) return;\n  mutations.forEach(m=>{\n    m.addedNodes.forEach(node=>{\n
