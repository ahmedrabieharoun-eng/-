<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b4a6e;
display:flex;
flex-direction:column;
align-items:center;
padding:15px;
color:white;
}

.topbar{
width:100%;
max-width:900px;
background:white;
color:#111;
padding:15px;
border-radius:15px;
display:flex;
justify-content:space-between;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.island-container{
position:relative;
width:900px;
max-width:100%;
}

.island{
width:100%;
display:block;
border-radius:20px;
}

.plot{
position:absolute;
width:120px;
height:120px;
border:3px dashed rgba(255,255,255,.9);
border-radius:15px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.1);
backdrop-filter:blur(3px);
}

.plot:hover{
transform:scale(1.05);
}

.plus{
font-size:50px;
font-weight:bold;
color:white;
}

.asset{
width:100%;
height:100%;
border-radius:15px;
overflow:hidden;
position:relative;
}

.asset img{
width:100%;
height:100%;
object-fit:cover;
}

.asset-info{
position:absolute;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.7);
padding:5px;
font-size:12px;
text-align:center;
}

.upgrade-btn{
margin-top:4px;
background:#29a329;
color:white;
border:none;
padding:4px 8px;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
<div>💰 Coins: <span id="coins"></span></div>
</div>

<div class="island-container">

<img class="island"
src="island.jpg">

<div class="plot" style="top:18%;left:18%" data-id="0"></div>
<div class="plot" style="top:18%;left:42%" data-id="1"></div>
<div class="plot" style="top:18%;left:66%" data-id="2"></div>

<div class="plot" style="top:40%;left:18%" data-id="3"></div>
<div class="plot" style="top:40%;left:42%" data-id="4"></div>
<div class="plot" style="top:40%;left:66%" data-id="5"></div>

<div class="plot" style="top:62%;left:18%" data-id="6"></div>
<div class="plot" style="top:62%;left:42%" data-id="7"></div>
<div class="plot" style="top:62%;left:66%" data-id="8"></div>

<div class="plot" style="top:82%;left:18%" data-id="9"></div>
<div class="plot" style="top:82%;left:42%" data-id="10"></div>
<div class="plot" style="top:82%;left:66%" data-id="11"></div>

</div>

<script>

const assetImages = [

"https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?w=500",
"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500",
"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500",
"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500",
"https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500",
"https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=500",
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500",
"https://images.unsplash.com/photo-1519046904884-53103b34b206?w=500",
"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=500",
"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500"

];

let game = JSON.parse(localStorage.getItem("islandGame"));

if(!game){

game = {

coins:999999,

plots:Array(12).fill().map((_,i)=>({

owned:false,
level:1,
name:"Asset "+(i+1)

}))

};

}

const coinsEl = document.getElementById("coins");

function save(){
localStorage.setItem(
"islandGame",
JSON.stringify(game)
);
}

function buyPlot(index){

let plot = game.plots[index];

if(plot.owned) return;

let cost = 1000;

if(game.coins < cost){

alert("Not enough coins");

return;

}

game.coins -= cost;

plot.owned = true;

save();

render();

}

function upgradePlot(index){

let plot = game.plots[index];

let cost = plot.level * 500;

if(game.coins < cost){

alert("Not enough coins");

return;

}

game.coins -= cost;

plot.level++;

save();

render();

}

function render(){

coinsEl.textContent =
game.coins.toLocaleString();

document
.querySelectorAll(".plot")
.forEach((el,index)=>{

let plot = game.plots[index];

if(!plot.owned){

el.innerHTML=
`<div class="plus">+</div>`;

el.onclick=()=>buyPlot(index);

}else{

el.innerHTML=`

<div class="asset">

<img src="${assetImages[index]}">

<div class="asset-info">

${plot.name}<br>

Level ${plot.level}

<br>

<button
class="upgrade-btn">

Upgrade

</button>

</div>

</div>

`;

el.onclick=null;

el.querySelector("button")
.onclick=(e)=>{

e.stopPropagation();

upgradePlot(index);

};

}

});

}

render();

</script>

</body>
</html>
