
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeworks Idle — Factory Chain</title>
<style>
  :root{
    --panel-bg: rgba(18,22,30,0.82);
    --panel-border: rgba(140,170,255,0.18);
    --text-main: #eaf0ff;
    --text-dim: #9fb0d0;
    --accent-green: #59e39d;
    --accent-amber: #ffb84d;
    --accent-blue: #5fb6ff;
  }
  html,body{height:100%;}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #24303f 0%, #0d1420 55%, #070b12 100%);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--text-main);
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:960px; height:780px;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(140,170,255,0.08);
  }
  canvas{ position:absolute; top:0; left:0; display:block; }
  #loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:#0b1018; z-index:50;
    font-size:14px; color:var(--text-dim); letter-spacing:.5px;
  }
  #loading .bar{ width:220px; height:6px; border-radius:4px; background:#1c2534; overflow:hidden; }
  #loading .fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent-green),var(--accent-blue)); transition:width .15s ease-out; }

  /* ---- HUD ---- */
  .hud-pill{
    position:absolute; display:flex; align-items:center; gap:8px;
    background:var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:10px; padding:6px 12px; font-size:13px; font-weight:600;
    backdrop-filter: blur(6px); box-shadow:0 4px 14px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .hud-pill .lbl{ color:var(--text-dim); font-weight:500; font-size:11px; }
  #rateFurnace{ top:26px; left:24px; }
  #rateTanks{ top:26px; right:24px; }
  #coinsPill{
    top:26px; left:50%; transform:translateX(-50%);
    font-size:16px; padding:8px 18px; gap:10px;
  }
  #coinsPill .coin-icon{
    width:16px;height:16px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--accent-amber) 60%, #b0781f 100%);
    box-shadow:0 0 8px rgba(255,184,77,.7);
  }
  #upgradeBtn{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#2a3a52,#182234);
    border:1px solid rgba(140,170,255,0.35);
    color:var(--text-main); border-radius:12px; padding:12px 22px;
    font-size:14px; font-weight:700; cursor:pointer; letter-spacing:.3px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    transition:transform .12s ease;
  }
  #upgradeBtn small{ display:block; font-weight:500; font-size:11px; color:var(--accent-amber); margin-top:2px;}
  #upgradeBtn:active{ transform:translateX(-50%) scale(.96); }
  #upgradeBtn.pulse{ animation: btnpulse 1.6s ease-in-out infinite; }
  @keyframes btnpulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 0 rgba(89,227,157,.45); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 8px rgba(89,227,157,0); }
  }
  #upgradeBtn:disabled{ opacity:.45; cursor:not-allowed; animation:none; }

  #footer-credit{
    position:absolute; bottom:8px; right:12px; font-size:10px; color:rgba(255,255,255,0.25);
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="loading">
    <div>Loading assets…</div>
    <div class="bar"><div class="fill" id="loadFill"></div></div>
  </div>

  <canvas id="scene" width="960" height="780"></canvas>

  <div class="hud-pill" id="rateFurnace"><span class="lbl">GLASS</span><span id="rateFurnaceVal">0/min</span></div>
  <div class="hud-pill" id="coinsPill"><div class="coin-icon"></div><span id="coinsVal">0</span></div>
  <div class="hud-pill" id="rateTanks"><span class="lbl">CHIPS</span><span id="rateTanksVal">0/min</span></div>

  <button id="upgradeBtn" class="pulse">
    Speed Up Production
    <small id="upgradeCost">Cost: 20</small>
  </button>
  <div id="footer-credit">original assets &amp; code</div>
</div>

<script>
/* =========================================================================
   PIPEWORKS IDLE — a from-scratch idle factory chain.
   Architecture (kept deliberately separated, per spec):
     1. AssetLoader   - loads the user's PNG sprite sheet once
     2. Easing        - pure math, reused by every animated value
     3. ParticleSystem - pooled smoke/spark/bubble particles
     4. PipeNetwork    - static pipe sprites + animated flow overlay
     5. ResourceOrb    - a resource traveling a polyline at constant speed
     6. Factory        - the production state machine (Idle→Working→
                         Processing→Ready→Output→Idle) + its own visual FX
     7. Game           - owns the update(dt)/render() loop (rAF), HUD sync
   Rendering is single-canvas (2D context) for the scene; the HUD (numbers,
   the upgrade button) is plain DOM so text stays crisp and cheap to update.
   ========================================================================= */

const IMG_BASE = "images/"; // adjust if you place this file elsewhere relative to /images

// ---------------------------------------------------------------------
// 1) ASSET LOADER
// ---------------------------------------------------------------------
const ASSET_LIST = {
  grass:      "Grass Tile.png",
  grassDark:  "Dark Grass Tile.png",
  pipeStraight: "Straight Pipe.png",
  pipeCorner:   "Corner Pipe.png",
  pipeT:        "T Pipe.png",
  pipeCross:    "Cross_Pipe.png",
  furnace:    "Furnace.png",
  tankBlue:   "Blue_Tank.png",
  tankOrange: "Orange_Tank.png",
  conveyor:   "Conveyor_Factory.png",
  resSand:    "Sand.png",
  resGlass:   "Glass.png",
  resBottleBlue:   "Blue_Bottle.png",
  resBottleOrange: "Orange_Bottle.png",
  resChip:    "chip.png"
};
const IMAGES = {};
let loadedCount = 0;
const failedFiles = [];
const totalToLoad = Object.keys(ASSET_LIST).length;

function loadAssets(onDone){
  Object.entries(ASSET_LIST).forEach(([key, file])=>{
    const img = new Image();
    img.onload = ()=>{
      loadedCount++;
      document.getElementById('loadFill').style.width = (loadedCount/totalToLoad*100)+"%";
      if(loadedCount === totalToLoad) finishLoading(onDone);
    };
    img.onerror = ()=>{
      loadedCount++;
      failedFiles.push(IMG_BASE + file);
      document.getElementById('loadFill').style.width = (loadedCount/totalToLoad*100)+"%";
      if(loadedCount === totalToLoad) finishLoading(onDone);
    };
    img.src = IMG_BASE + file;
    IMAGES[key] = img;
  });
}

function finishLoading(onDone){
  if(failedFiles.length){
    // Don't silently render a blank canvas — show exactly what's missing.
    const box = document.getElementById('loading');
    box.innerHTML =
      '<div style="color:#ff9d9d;font-weight:700;">Could not load '+failedFiles.length+' image(s)</div>' +
      '<div style="font-size:12px;max-width:640px;text-align:left;line-height:1.6;color:#cbd5e1;">' +
        failedFiles.map(f=>'&bull; '+f).join('<br>') +
      '</div>' +
      '<div style="font-size:12px;color:#9fb0d0;max-width:640px;">This file expects an <b>images/</b> folder ' +
      'sitting right next to it (same directory), containing the exact filenames above — including spaces and ' +
      'capitalization. If you\'re opening this from disk, keep index.html and images/ together and open ' +
      'index.html directly. If you\'re hosting it (e.g. GitHub Pages), double-check the images/ folder was ' +
      'actually deployed and the filenames match exactly (hosts are case-sensitive).</div>';
    console.error('Missing image assets:', failedFiles);
    return; // stop here so the failure is visible instead of an empty canvas
  }
  onDone();
}

// ---------------------------------------------------------------------
// 2) EASING — every tween in the game pulls from this single table
// ---------------------------------------------------------------------
const Ease = {
  linear: t=>t,
  outCubic: t=> 1-Math.pow(1-t,3),
  inOutSine: t=> -(Math.cos(Math.PI*t)-1)/2,
  outBack: t=>{ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  outElastic: t=>{
    const c4 = (2*Math.PI)/3;
    return t===0?0:t===1?1: Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1;
  },
  outQuad: t=> 1-(1-t)*(1-t)
};

// ---------------------------------------------------------------------
// small canvas helper: draw an image centered at (x,y), optional rotation
// ---------------------------------------------------------------------
function drawCentered(ctx, img, x, y, w, h, rotDeg=0, alpha=1){
  if(!img || !img.complete) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(rotDeg) ctx.rotate(rotDeg * Math.PI/180);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  ctx.restore();
}

// ---------------------------------------------------------------------
// 3) PARTICLE SYSTEM — one pooled array, particles are recycled (no GC churn)
// ---------------------------------------------------------------------
class ParticleSystem{
  constructor(max=220){
    this.pool = new Array(max).fill(null).map(()=>({active:false}));
  }
  spawn(opts){
    const p = this.pool.find(p=>!p.active);
    if(!p) return;
    Object.assign(p, {
      active:true, age:0,
      x:opts.x, y:opts.y,
      vx:opts.vx||0, vy:opts.vy|| -20,
      life: opts.life||1,
      size: opts.size||4,
      color: opts.color||"255,255,255",
      grow: opts.grow||0,
      kind: opts.kind||"dot",
      drift: opts.drift||0
    });
  }
  update(dt){
    for(const p of this.pool){
      if(!p.active) continue;
      p.age += dt;
      if(p.age >= p.life){ p.active=false; continue; }
      p.x += p.vx*dt + Math.sin(p.age*3+p.x)*p.drift*dt;
      p.y += p.vy*dt;
      p.size += p.grow*dt;
    }
  }
  render(ctx){
    for(const p of this.pool){
      if(!p.active) continue;
      const t = p.age/p.life;
      const alpha = 1 - t;
      ctx.save();
      ctx.globalAlpha = Math.max(0,alpha);
      if(p.kind==="spark"){
        ctx.fillStyle = `rgb(${p.color})`;
        ctx.shadowColor = `rgb(${p.color})`;
        ctx.shadowBlur = 8;
      } else {
        ctx.fillStyle = `rgba(${p.color},${0.85})`;
      }
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(0,p.size),0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------
// 4) FLOATING TEXT (+1 / +5 / +10, smoothly rising & fading)
// ---------------------------------------------------------------------
class FloatingTexts{
  constructor(){ this.items = []; }
  spawn(x,y,text,color="#59e39d"){
    this.items.push({x,y,text,color,age:0,life:1.1});
  }
  update(dt){
    this.items.forEach(i=>i.age+=dt);
    this.items = this.items.filter(i=>i.age < i.life);
  }
  render(ctx){
    ctx.textAlign="center";
    ctx.font="bold 15px Segoe UI, Arial";
    for(const i of this.items){
      const t = i.age/i.life;
      const y = i.y - Ease.outCubic(t)*40;
      const alpha = 1 - Ease.inOutSine(t);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = i.color;
      ctx.shadowColor = i.color;
      ctx.shadowBlur = 6;
      ctx.fillText(i.text, i.x, y);
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------
// PIPE VISUALS — rotation lookup derived from inspecting the actual art:
//   Straight Pipe.png : default ports {left,right}   (horizontal)
//   Corner Pipe.png    : default ports {top,left}
//   T Pipe.png         : default ports {left,right,bottom}
//   Cross_Pipe.png     : ports {top,right,bottom,left} (symmetric, no rotation)
// Rotating the corner 90/180/270 deg (clockwise) sweeps the port pair:
//   0:{top,left}  90:{top,right}  180:{right,bottom}  270:{bottom,left}
// ---------------------------------------------------------------------
class Pipe{
  constructor(img, x, y, rot, w, h){ Object.assign(this,{img,x,y,rot,w,h}); }
  draw(ctx){ drawCentered(ctx, this.img, this.x, this.y, this.w, this.h, this.rot); }
}

// A PolyPath is the *functional* travel-line a resource orb follows.
// It also draws the animated green flow (dash-offset) directly above the pipe sprites.
class PolyPath{
  constructor(points, glowColor="120,230,160"){
    this.points = points; // [{x,y}, ...] orthogonal waypoints
    this.glowColor = glowColor;
    this.segLens = [];
    this.total = 0;
    for(let i=0;i<points.length-1;i++){
      const dx=points[i+1].x-points[i].x, dy=points[i+1].y-points[i].y;
      const len = Math.hypot(dx,dy);
      this.segLens.push(len);
      this.total += len;
    }
    this.flowPhase = Math.random()*20;
    this.active = 0; // ramps up/down for glow intensity (smoothed)
  }
  pointAt(t){
    let dist = t*this.total;
    for(let i=0;i<this.segLens.length;i++){
      if(dist <= this.segLens[i] || i===this.segLens.length-1){
        const segT = this.segLens[i] ? dist/this.segLens[i] : 0;
        const a = this.points[i], b = this.points[i+1];
        return { x: a.x + (b.x-a.x)*Math.min(segT,1), y: a.y + (b.y-a.y)*Math.min(segT,1) };
      }
      dist -= this.segLens[i];
    }
    return this.points[this.points.length-1];
  }
  update(dt){
    this.flowPhase += dt*36; // dash scroll speed
    this.active += ((this.active>0?1:0.15) - this.active) * Math.min(1, dt*3); // decays back to a dim idle glow
  }
  pulse(){ this.active = 1; }
  drawFlow(ctx){
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const glowStrength = 0.35 + this.active*0.65;
    ctx.strokeStyle = `rgba(${this.glowColor},${0.18+0.5*glowStrength})`;
    ctx.lineWidth = 10;
    ctx.shadowColor = `rgba(${this.glowColor},0.9)`;
    ctx.shadowBlur = 10 * glowStrength;
    ctx.beginPath();
    this.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();

    // moving dash segments = flowing energy / directional particles
    ctx.setLineDash([10,16]);
    ctx.lineDashOffset = -this.flowPhase;
    ctx.strokeStyle = `rgba(${this.glowColor},${0.7*glowStrength+0.2})`;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    this.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// 5) RESOURCE ORB — travels a PolyPath at constant speed, with a
//    scale/bounce spawn tween and a scale/fade arrival tween.
// ---------------------------------------------------------------------
class ResourceOrb{
  constructor(path, img, size, travelTime, onArrive, glowColor){
    this.path = path;
    this.img = img;
    this.size = size;
    this.travelTime = travelTime;
    this.t = 0;
    this.onArrive = onArrive;
    this.glowColor = glowColor;
    this.dead = false;
    this.spawnAge = 0;
    this.arrived = false;
    path.pulse();
    game.particles.spawn({x:path.points[0].x,y:path.points[0].y,vx:0,vy:0,life:0.35,size:14,color:glowColor,kind:"flash"});
  }
  update(dt){
    if(this.arrived) return;
    this.spawnAge += dt;
    this.t += dt/this.travelTime;
    if(this.t >= 1){
      this.t = 1;
      this.arrived = true;
      this.path.pulse();
      const end = this.path.pointAt(1);
      game.particles.spawn({x:end.x,y:end.y,vx:0,vy:0,life:0.35,size:14,color:this.glowColor,kind:"flash"});
      this.onArrive && this.onArrive();
      this.dead = true;
    }
  }
  render(ctx){
    const p = this.path.pointAt(this.t);
    // spawn scale-up with slight overshoot ("bounce"), settle quickly
    const spawnT = Math.min(1, this.spawnAge/0.28);
    const scale = Ease.outBack(spawnT);
    const bounce = Math.sin(Math.min(1,this.spawnAge/0.5)*Math.PI*3) * (1-spawnT) * 3;
    ctx.save();
    ctx.shadowColor = `rgba(${this.glowColor},0.9)`;
    ctx.shadowBlur = 12;
    drawCentered(ctx, this.img, p.x, p.y - bounce, this.size*scale, this.size*scale);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// 6) FACTORY — the production state machine.
//    States: IDLE -> WORKING -> PROCESSING -> READY -> OUTPUT -> IDLE
//    A factory only leaves IDLE when its input requirement is satisfied
//    (producers have no requirement; consumers need buffered input).
//    Every factory runs its own independent timer -> fully asynchronous.
// ---------------------------------------------------------------------
const State = { IDLE:"IDLE", WORKING:"WORKING", PROCESSING:"PROCESSING", READY:"READY", OUTPUT:"OUTPUT" };

class Factory{
  constructor(cfg){
    Object.assign(this, cfg);
    // cfg: id, kind ('furnace'|'tank'|'conveyor'), img, x, y, w, h,
    //      needs: {resourceKey:count} or null for producers,
    //      outputs: [{path, img, size, travelTime, toFactory, glowColor}],
    //      baseDurations: {working,processing,ready,output}, tint
    this.state = State.IDLE;
    this.timer = 0;
    this.buffer = {}; // for consumers: how many of each input resource are waiting
    if(this.needs) Object.keys(this.needs).forEach(k=>this.buffer[k]=0);
    this.cyclesDone = 0;
    this.recentOutputs = []; // timestamps, for rate/min smoothing
    this.jitter = Math.random()*10;
    this.gateOpen = 0; // 0..1 tween for output gate
    this.liquidFill = 0; // for tanks
    this.beltScroll = 0; // for conveyor
    this.lightBlink = 0;
  }
  durations(){
    const m = game.speedMultiplier;
    return {
      working: this.baseDurations.working/m,
      processing: this.baseDurations.processing/m,
      ready: this.baseDurations.ready/m,
      output: this.baseDurations.output/m
    };
  }
  canStart(){
    if(!this.needs) return true;
    return Object.entries(this.needs).every(([k,n])=> this.buffer[k] >= n);
  }
  receive(resourceKey){
    if(this.buffer[resourceKey] !== undefined) this.buffer[resourceKey]++;
  }
  update(dt){
    const d = this.durations();
    this.lightBlink += dt;
    switch(this.state){
      case State.IDLE:
        this.liquidFill += (0 - this.liquidFill)*Math.min(1,dt*2);
        if(this.canStart()){
          if(this.needs) Object.keys(this.needs).forEach(k=>this.buffer[k]-=this.needs[k]);
          this.state = State.WORKING; this.timer = 0;
        }
        break;
      case State.WORKING:
        this.timer += dt;
        this.beltScroll += dt*60;
        if(this.kind==="furnace" && Math.random()<dt*4){
          game.particles.spawn({x:this.x+ (Math.random()-0.5)*20, y:this.y-this.h*0.28, vx:(Math.random()-0.5)*8, vy:-26-Math.random()*14, life:1.1+Math.random()*0.4, size:5+Math.random()*4, color:"200,205,215", kind:"smoke", grow:6});
        }
        if(this.timer >= d.working){ this.state=State.PROCESSING; this.timer=0; }
        break;
      case State.PROCESSING:
        this.timer += dt;
        {
          const p = Math.min(1,this.timer/d.processing);
          if(this.kind==="tank"){
            this.liquidFill = Ease.inOutSine(p);
            if(Math.random()<dt*10){
              game.particles.spawn({x:this.x+(Math.random()-0.5)*this.w*0.32, y:this.y+this.h*0.28, vx:0, vy:-18-Math.random()*10, life:0.9, size:2+Math.random()*2, color:this.tint, kind:"bubble"});
            }
          }
          if(this.kind==="furnace" && Math.random()<dt*6){
            game.particles.spawn({x:this.x+(Math.random()-0.5)*20, y:this.y-this.h*0.28, vx:(Math.random()-0.5)*10, vy:-30-Math.random()*16, life:1.2, size:5+Math.random()*5, color:"210,215,225", kind:"smoke", grow:7});
          }
          if(this.kind==="conveyor"){
            this.beltScroll += dt*90;
            if(Math.random()<dt*8){
              game.particles.spawn({x:this.x+this.w*0.15,y:this.y+this.h*0.32,vx:40+Math.random()*20,vy:-6,life:0.5,size:2.5,color:"255,210,120",kind:"spark"});
            }
          }
        }
        if(this.timer >= d.processing){ this.state=State.READY; this.timer=0; }
        break;
      case State.READY:
        this.timer += dt;
        if(this.timer >= d.ready){ this.state=State.OUTPUT; this.timer=0; this.gateOpen=0; this.doOutput(); }
        break;
      case State.OUTPUT:
        this.timer += dt;
        this.gateOpen = Ease.outCubic(Math.min(1,this.timer/(d.output*0.6)));
        if(this.timer >= d.output){
          this.state = State.IDLE; this.timer=0;
          this.recentOutputs.push(performance.now());
        }
        break;
    }
  }
  doOutput(){
    this.cyclesDone++;
    // spawn a resource orb on every configured outgoing path
    (this.outputs||[]).forEach(o=>{
      const orb = new ResourceOrb(o.path, o.img, o.size, o.travelTime, ()=>{
        o.toFactory && o.toFactory.receive(o.resourceKey);
        o.onArriveExtra && o.onArriveExtra();
      }, o.glowColor);
      game.orbs.push(orb);
    });
    game.particles.spawn({x:this.x,y:this.y-this.h*0.15,vx:0,vy:-10,life:0.5,size:this.w*0.5,color:this.tint,kind:"ringflash"});
  }
  rateSmoothed(){
    const now = performance.now();
    this.recentOutputs = this.recentOutputs.filter(t=> now-t < 20000);
    return this.recentOutputs.length * 3; // events in last 20s -> per-min
  }
  glowColorForState(){
    switch(this.state){
      case State.WORKING: return "90,230,150";
      case State.PROCESSING: return "255,170,70";
      case State.READY: return "255,230,120";
      case State.OUTPUT: return "255,230,120";
      default: return "80,100,130";
    }
  }
  progress(){
    const d = this.durations();
    if(this.state===State.WORKING) return this.timer/d.working;
    if(this.state===State.PROCESSING) return this.timer/d.processing;
    return null;
  }
  render(ctx){
    ctx.save();
    // ambient glow plate under the machine, color = current state
    const glow = this.glowColorForState();
    const pulse = (this.state===State.READY) ? (0.6+0.4*Math.sin(this.lightBlink*10)) : 1;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const grad = ctx.createRadialGradient(this.x,this.y+this.h*0.32,4,this.x,this.y+this.h*0.32,this.w*0.62);
    grad.addColorStop(0, `rgba(${glow},${0.28*pulse})`);
    grad.addColorStop(1, `rgba(${glow},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+this.h*0.32,this.w*0.62,this.h*0.30,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // machine vibration during WORKING (small jitter offset)
    let jx=0, jy=0;
    if(this.state===State.WORKING){
      jx = Math.sin(performance.now()/40 + this.jitter)*1.1;
      jy = Math.cos(performance.now()/55 + this.jitter)*0.8;
    }
    // READY pulse: subtle scale breathing
    const readyScale = this.state===State.READY ? 1+0.02*Math.sin(this.lightBlink*10) : 1;

    drawCentered(ctx, this.img, this.x+jx, this.y+jy, this.w*readyScale, this.h*readyScale);

    // tank liquid overlay: tint the glass region with a rising fill + shine sweep
    if(this.kind==="tank"){
      const glassX = this.x - this.w*0.20, glassY = this.y - this.h*0.28;
      const glassW = this.w*0.40, glassH = this.h*0.46;
      ctx.save();
      ctx.beginPath();
      ctx.rect(glassX, glassY, glassW, glassH);
      ctx.clip();
      const fillH = glassH*this.liquidFill;
      const wobble = Math.sin(performance.now()/220)*2;
      ctx.fillStyle = this.tintRGBA(0.55);
      ctx.beginPath();
      ctx.moveTo(glassX, glassY+glassH-fillH+wobble);
      ctx.lineTo(glassX+glassW, glassY+glassH-fillH-wobble);
      ctx.lineTo(glassX+glassW, glassY+glassH);
      ctx.lineTo(glassX, glassY+glassH);
      ctx.closePath(); ctx.fill();
      // occasional glass shine sweep
      const shineT = (performance.now()/1000 + this.jitter) % 4;
      if(shineT < 1){
        const sx = glassX - glassW + shineT*glassW*3;
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        ctx.save();
        ctx.translate(sx, glassY+glassH/2);
        ctx.rotate(-0.4);
        ctx.fillRect(-6,-glassH,12,glassH*2);
        ctx.restore();
      }
      ctx.restore();
    }

    // conveyor blinking status lights (matches the little display on the sprite)
    if(this.kind==="conveyor"){
      const lx = this.x - this.w*0.30, ly = this.y - this.h*0.02;
      for(let i=0;i<3;i++){
        const on = this.state!==State.IDLE && (Math.floor(this.lightBlink*3+i)%3===0);
        ctx.fillStyle = on ? "rgba(120,230,255,0.95)" : "rgba(60,90,110,0.4)";
        ctx.shadowColor = "rgba(120,230,255,0.9)";
        ctx.shadowBlur = on?8:0;
        ctx.beginPath(); ctx.arc(lx+i*10, ly, 2.6, 0, Math.PI*2); ctx.fill();
      }
    }

    // furnace / conveyor gate flash + belt tick marks near the output mouth during OUTPUT
    if(this.state===State.OUTPUT){
      ctx.save();
      ctx.globalAlpha = 1-this.gateOpen*0.5;
      ctx.fillStyle = "rgba(255,235,180,0.5)";
      ctx.shadowColor = "rgba(255,235,180,0.9)";
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y+this.h*0.34, this.w*0.22*this.gateOpen+2, this.h*0.06, 0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }
  tintRGBA(a){ return `rgba(${this.tint},${a})`; }
}

// ---------------------------------------------------------------------
// 7) GAME — owns everything, drives the single rAF loop
// ---------------------------------------------------------------------
const game = {
  particles: new ParticleSystem(260),
  floaters: new FloatingTexts(),
  orbs: [],
  factories: [],
  pipesVisual: [],
  paths: [],
  coins: 0,
  coinsDisplay: 0,
  speedMultiplier: 1,
  upgradeLevel: 0,
  lastTime: 0
};

function buildWorld(){
  const c = { furnace:{x:480,y:135}, blue:{x:300,y:405}, orange:{x:660,y:405}, conv:{x:480,y:615} };

  // ---- pipe VISUALS (static sprites, placed & rotated per the port lookup) ----
  const P = IMAGES;
  game.pipesVisual = [
    // furnace -> split
    new Pipe(P.pipeStraight, 480, 213, 90, 60, 24),
    new Pipe(P.pipeT, 480, 240, 180, 70, 44),          // split: ports {left,right,top}
    // left branch down to blue tank (horizontal run widened to fully bridge the T and the elbow)
    new Pipe(P.pipeStraight, 384, 240, 0, 130, 24),
    new Pipe(P.pipeCorner, 300, 240, 180, 46, 48),      // ports {right,bottom}
    new Pipe(P.pipeStraight, 300, 278, 90, 66, 24),
    // right branch down to orange tank
    new Pipe(P.pipeStraight, 576, 240, 0, 130, 24),
    new Pipe(P.pipeCorner, 660, 240, 270, 46, 48),      // ports {left,bottom}
    new Pipe(P.pipeStraight, 660, 278, 90, 66, 24),
    // blue tank -> merge
    new Pipe(P.pipeStraight, 300, 512, 90, 60, 24),
    new Pipe(P.pipeCorner, 300, 545, 90, 46, 48),       // ports {right,top}
    new Pipe(P.pipeStraight, 384, 545, 0, 130, 24),
    // orange tank -> merge
    new Pipe(P.pipeStraight, 660, 512, 90, 60, 24),
    new Pipe(P.pipeCorner, 660, 545, 0, 46, 48),        // ports {top,left}
    new Pipe(P.pipeStraight, 576, 545, 0, 130, 24),
    // merge -> conveyor
    new Pipe(P.pipeT, 480, 545, 0, 70, 44),             // ports {left,right,bottom}
    new Pipe(P.pipeStraight, 480, 572, 90, 60, 24),
  ];

  // ---- functional travel paths (orthogonal, matches pipe centerlines) ----
  const pathFurnaceToBlue = new PolyPath([
    {x:480,y:200},{x:480,y:240},{x:300,y:240},{x:300,y:302}
  ], "120,230,160");
  const pathFurnaceToOrange = new PolyPath([
    {x:480,y:200},{x:480,y:240},{x:660,y:240},{x:660,y:302}
  ], "120,230,160");
  const pathBlueToConv = new PolyPath([
    {x:300,y:498},{x:300,y:545},{x:480,y:545},{x:480,y:588}
  ], "120,190,255");
  const pathOrangeToConv = new PolyPath([
    {x:660,y:498},{x:660,y:545},{x:480,y:545},{x:480,y:588}
  ], "255,160,90");
  game.paths = [pathFurnaceToBlue, pathFurnaceToOrange, pathBlueToConv, pathOrangeToConv];

  // ---- factories ----
  const furnace = new Factory({
    id:"furnace", kind:"furnace", img:P.furnace, x:c.furnace.x, y:c.furnace.y, w:170, h:170*383/444,
    needs:null, tint:"255,180,90",
    baseDurations:{working:1.1, processing:1.3, ready:0.35, output:0.5}
  });
  const tankBlue = new Factory({
    id:"tankBlue", kind:"tank", img:P.tankBlue, x:c.blue.x, y:c.blue.y, w:150, h:150*384/295,
    needs:{glass:1}, tint:"70,160,255",
    baseDurations:{working:0.7, processing:1.6, ready:0.3, output:0.45}
  });
  const tankOrange = new Factory({
    id:"tankOrange", kind:"tank", img:P.tankOrange, x:c.orange.x, y:c.orange.y, w:150, h:150*389/295,
    needs:{glass:1}, tint:"255,140,60",
    baseDurations:{working:0.7, processing:1.6, ready:0.3, output:0.45}
  });
  const conveyor = new Factory({
    id:"conveyor", kind:"conveyor", img:P.conveyor, x:c.conv.x, y:c.conv.y, w:190, h:190*376/470,
    needs:{bottleBlue:1, bottleOrange:1}, tint:"180,140,255",
    baseDurations:{working:0.9, processing:1.2, ready:0.3, output:0.5}
  });

  furnace.outputs = [
    {path:pathFurnaceToBlue, img:P.resGlass, size:34, travelTime:0.9, toFactory:tankBlue, resourceKey:"glass", glowColor:"120,230,160"},
    {path:pathFurnaceToOrange, img:P.resGlass, size:34, travelTime:0.9, toFactory:tankOrange, resourceKey:"glass", glowColor:"120,230,160"}
  ];
  tankBlue.outputs = [
    {path:pathBlueToConv, img:P.resBottleBlue, size:34, travelTime:0.85, toFactory:conveyor, resourceKey:"bottleBlue", glowColor:"120,190,255"}
  ];
  tankOrange.outputs = [
    {path:pathOrangeToConv, img:P.resBottleOrange, size:34, travelTime:0.85, toFactory:conveyor, resourceKey:"bottleOrange", glowColor:"255,160,90"}
  ];
  conveyor.outputs = []; // handled specially: sells directly to storage below

  const baseConveyorDoOutput = conveyor.doOutput.bind(conveyor);
  conveyor.doOutput = function(){
    baseConveyorDoOutput();
    const start = {x:conveyor.x, y:conveyor.y+conveyor.h*0.30};
    const end = {x:conveyor.x+230, y:conveyor.y+40};
    const path = new PolyPath([start,{x:start.x+80,y:start.y+10},end], "255,215,130");
    const orb = new ResourceOrb(path, IMAGES.resChip, 30, 0.55, ()=>{
      const gain = 1 + Math.floor(game.upgradeLevel/3);
      game.coins += gain;
      game.floaters.spawn(end.x, end.y-10, "+"+gain, "#ffd27a");
      game.storageRate.push(performance.now());
    }, "255,215,130");
    game.orbs.push(orb);
  };

  game.factories = [furnace, tankBlue, tankOrange, conveyor];
  game.storageRate = [];
  game.storagePoint = {x: c.conv.x+230, y:c.conv.y+40};
  game.sandDecor = {x:c.furnace.x-95, y:c.furnace.y+55, w:70, h:70*274/398};
}

// ---------------------------------------------------------------------
// GROUND — tiled grass with a slightly darker "clean" pad under the
// production column, per spec ("factory area remains clean").
// ---------------------------------------------------------------------
function drawGround(ctx){
  const tile = IMAGES.grass, tileDark = IMAGES.grassDark;
  const step = 92;
  for(let y=-10;y<820;y+=step){
    for(let x=-10;x<980;x+=step){
      drawCentered(ctx, tile, x+step/2, y+step/2, step+2, step+2);
    }
  }
  // dark pad strip behind the factory column
  ctx.save();
  ctx.globalAlpha = 0.55;
  for(const cx of [480]){
    for(let y=40; y<720; y+=step){
      drawCentered(ctx, tileDark, cx, y, step+4, step+4);
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------------------
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

function update(dt){
  game.factories.forEach(f=>f.update(dt));
  game.paths.forEach(p=>p.update(dt));
  game.orbs.forEach(o=>o.update(dt));
  game.orbs = game.orbs.filter(o=>!o.dead);
  game.particles.update(dt);
  game.floaters.update(dt);
  game.coinsDisplay += (game.coins - game.coinsDisplay) * Math.min(1, dt*6);
  syncHUD();
}

function render(){
  ctx.clearRect(0,0,960,780);
  drawGround(ctx);

  // z-order: pipes (static) -> flow overlay -> sand decor -> factories -> orbs -> particles -> floating text
  game.pipesVisual.forEach(p=>p.draw(ctx));
  game.paths.forEach(p=>p.drawFlow(ctx));

  drawCentered(ctx, IMAGES.resSand, game.sandDecor.x, game.sandDecor.y, game.sandDecor.w, game.sandDecor.h);

  game.factories.forEach(f=>f.render(ctx));

  // progress bars under each working/processing factory
  game.factories.forEach(f=>{
    const p = f.progress();
    if(p===null) return;
    const bw = f.w*0.55, bx = f.x-bw/2, by = f.y+f.h*0.52;
    ctx.save();
    ctx.fillStyle = "rgba(10,14,20,0.55)";
    ctx.beginPath(); ctx.roundRect(bx,by,bw,7,4); ctx.fill();
    const col = f.state===State.PROCESSING ? "255,170,70" : "90,230,150";
    ctx.fillStyle = `rgb(${col})`;
    ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.roundRect(bx,by,bw*Math.min(1,p),7,4); ctx.fill();
    ctx.restore();
  });

  game.orbs.forEach(o=>o.render(ctx));
  game.particles.render(ctx);

  // storage collector (simple original glowing crate — no reference art needed)
  drawStorage(ctx);

  game.floaters.render(ctx);
}

function drawStorage(ctx){
  const {x,y} = game.storagePoint;
  ctx.save();
  ctx.translate(x,y);
  const grad = ctx.createRadialGradient(0,10,2,0,10,50);
  grad.addColorStop(0,"rgba(255,210,120,0.35)"); grad.addColorStop(1,"rgba(255,210,120,0)");
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,10,50,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#2a2035";
  ctx.strokeStyle = "rgba(255,210,120,0.8)";
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-26,-14,52,40,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle="rgba(255,210,120,0.9)";
  ctx.font="bold 11px Segoe UI";
  ctx.textAlign="center";
  ctx.fillText("STORAGE", 0, 34);
  ctx.restore();
}

let acc=0;
function loop(now){
  if(!game.lastTime) game.lastTime = now;
  let dt = (now - game.lastTime)/1000;
  dt = Math.min(dt, 0.05); // clamp to avoid spiral-of-death on tab-switch
  game.lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// HUD sync (DOM writes only when the displayed integer actually changes)
// ---------------------------------------------------------------------
let lastHud = {coins:null, rF:null, rC:null, cost:null};
function syncHUD(){
  const coinsInt = Math.round(game.coinsDisplay);
  if(coinsInt !== lastHud.coins){ document.getElementById('coinsVal').textContent = coinsInt; lastHud.coins = coinsInt; }

  const furnace = game.factories[0];
  const rF = Math.round(furnace.rateSmoothed());
  if(rF !== lastHud.rF){ document.getElementById('rateFurnaceVal').textContent = rF+"/min"; lastHud.rF = rF; }

  const now = performance.now();
  game.storageRate = (game.storageRate||[]).filter(t=>now-t<20000);
  const rC = Math.round(game.storageRate.length*3);
  if(rC !== lastHud.rC){ document.getElementById('rateTanksVal').textContent = rC+"/min"; lastHud.rC = rC; }

  const cost = upgradeCost();
  if(cost !== lastHud.cost){ document.getElementById('upgradeCost').textContent = "Cost: "+cost; lastHud.cost = cost; }
  document.getElementById('upgradeBtn').disabled = game.coins < cost;
}

function upgradeCost(){ return Math.round(20*Math.pow(1.18, game.upgradeLevel)); }
document.getElementById('upgradeBtn').addEventListener('click', ()=>{
  const cost = upgradeCost();
  if(game.coins < cost) return;
  game.coins -= cost;
  game.upgradeLevel++;
  game.speedMultiplier = 1 + game.upgradeLevel*0.09;
});

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
loadAssets(()=>{
  buildWorld();
  document.getElementById('loading').style.display='none';
  requestAnimationFrame(loop);
});
