  if(node.nodeType!==1) return;\n      // Check the node itself and any button descendants\n      const btns = node.tagName==='BUTTON' ? [node] : [...(node.querySelectorAll ? node.querySelectorAll('button') : [])];\n      btns.forEach(b=>{\n        if(!b.disabled && !b.hasAttribute('data-cooled')){\n          b.setAttribute('data-cooled','1');\n          b.disabled=true;\n          b.style.opacity='0.4';\n          b.style.filter='grayscale(1)';\n        }\n      });\n    });\n  });\n});\n_cooldownObserver.observe(document.body||document.documentElement, {childList:true, subtree:true});\n\nfunction _startBtnCooldown(){\n  if(_globalBtnCooldown) return;\n  _globalBtnCooldown = true;\n  // Mark & disable every button that is currently enabled\n  document.querySelectorAll('button').forEach(b=>{\n    if(!b.disabled){\n      b.setAttribute('data-cooled', '1');\n      b.disabled = true;\n      b.style.opacity = '0.4';\n      b.style.filter = 'grayscale(1)';\n    }\n  });\n  if(_globalCooldownTimer) clearTimeout(_globalCooldownTimer);\n  _globalCooldownTimer = setTimeout(()=>{\n    _globalBtnCooldown = false;\n    _globalCooldownTimer = null;\n    // Re-enable only the buttons WE disabled (attribute = '1')\n    document.querySelectorAll('button[data-cooled=\"1\"]').forEach(b=>{\n      b.removeAttribute('data-cooled');\n      b.disabled = false;\n      b.style.opacity = '';\n      b.style.filter = '';\n    });\n  }, 2000);\n}\nconst DEBOUNCE_MS  = 2000;\nfunction debounce(key){\n  const now = Date.now();\n  const last = _debounceMap.get(key) || 0;\n  if(now - last < DEBOUNCE_MS){\n    const rem = Math.ceil((DEBOUNCE_MS - (now - last)) / 1000);\n    showNotif(`\\u23F3 Wait ${rem}s before trying again`,'w');\n    return false;\n  }\n  _debounceMap.set(key, now);\n  return true;\n}\n\n/* \u2550\u2550\u2550\u2550 API \u2014 Single Server \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nlet _apiInFlight = 0;\n\nasync function api(action, data={}){\n  if(_apiInFlight > 8) throw new Error('Too many requests');\n  _apiInFlight++;\n  // Trigger 6-second button cooldown on EVERY API call to prevent 429 spam\n  // (covers double-click on same button AND fast clicks across different buttons)\n  if(action !== 'racePoll' && action !== 'getState') _startBtnCooldown();\n  const authHdr = S.tg?.initData ? `Telegram ${S.tg.initData}` : null;\n  try{\n    const j = await _call(null, action, data, authHdr);\n    if(!j.success){\n      const err = new Error(j.error || 'API error');\n      err.errorCode = j.errorCode || '';\n      err.missing   = j.missing;\n      throw err;\n    }\n    return j.data;\n  } finally { _apiInFlight--; }\n}\ntry{window.api=api;}catch(_){ }\n\nasync function refreshAppState(opts={}){\n  try{\n    await loadState();\n    refreshBikeViews();\n    return true;\n  }catch(e){\n    if(!opts.silent) console.warn('refreshAppState:', e.message);\n    refreshBikeViews();\n    return false;\n  }\n}\nwindow.refreshAppState = refreshAppState;\n\nasync function loadState(){\n  try{\n    // Pass raw initData so server can extract start_param from it\n    const d = await api('getState', {\n      start_param : S.startParam || '',\n      _initData   : S.tg?.initData || '',\n    });\n\n    // \ud83d\udd14 Check for new referrals since last check (referral join notification)\n    const prevRefCount = S.refs ? S.refs.length : 0;\n    S.user      = d.user    || S.user;\n    S.user.ownedBikes   = d.user?.ownedBikes   || S.user.ownedBikes   || [];\n    S.user.bikeUpgrades = d.user?.bikeUpgrades || S.user.bikeUpgrades || {};\n    S.user.bikeMining   = d.user?.bikeMining   || S.user.bikeMining   || {};\n    S.refs      = d.referrals || [];\n    S.wdHist    = d.wdHistory   || [];\n    S.balLog    = d.balanceLog  || [];\n    S.doneTasks = d.completedTasks || [];\n    S.completedMissions = d.completedMissions || [];\n    S.tasks     = d.tasks || { partner:[], community:[] };\n    S.forcedChannels = d.forcedChannels || [];\n    S.partnerPosts = d.partnerPosts || [];\n    // Mark data as successfully loaded from server\n    S._dataLoaded = true;\n    if(typeof window.__checkForcedSub==='function') setTimeout(window.__checkForcedSub, 250);\n    // \ud83d\udd14 Show in-app notification if new referral joined\n    if(S._initialized && S.refs.length > prevRefCount){\n      const newest = S.refs[0];\n      const name = newest ? esc(newest.name||'') : '';\n      const lang = localStorage.getItem('pandaLang')||'en';\n      const t = TRANSLATIONS[lang]||TRANSLATIONS['en'];\n      const msg = (t.newRefNotif||TRANSLATIONS['en'].newRefNotif).replace('{name}', name||'\ud83d\udc64');\n      showNotif(msg,'s');\n    }\n    if(d.pendingDeposit) startDepVerify(d.pendingDeposit.depId, d.pendingDeposit.txHash);\n    syncTopbar();\n  }catch(e){\n    console.warn('loadState:', e.message);\n    // If data was never loaded yet, don't call updateUI (keeps UI in loading state)\n    if(!S._dataLoaded) return;\n  }\n  // Only update UI if we have confirmed server data at least once\n  if(S._dataLoaded){\n    updateUI();\n    // Always refresh race carousel so newly bought/mined bikes appear immediately\n    if(typeof window._raceInit==='function'){\n      window._raceInit();\n    }\n  }\n  S._initialized = true;\n}\n\n\n\n\n\n\nlet _miningInFlight=false;\nasync \nasync \n// Only update mining timers (not full re-render) every second\nsetInterval(()=>{\n  const mineSection = document.getElementById('sectionFriends');\n  if(!mineSection||!mineSection.classList.contains('active')) return;\n  // Just update countdown buttons, no full re-render\n  const now = Date.now();\n  const mining = S.user?.bikeMining||{};\n  document.querySelectorAll('.mine-action-btn.wait').forEach(btn=>{\n    const card = btn.closest('.mine-car-card');\n    if(!card) return;\n    const lv = card.dataset.lv;\n    const rec = mining[String(lv)]||mining[lv];\n    if(rec&&rec.status==='active'&&(rec.endsAt||0)>now){\n      btn.textContent = formatMiningTime((rec.endsAt||0)-now);\n    } \n  });\n},1000);\n\n/* \u2550\u2550\u2550\u2550 UPDATE UI \u2550\u2550\u2550\u2550 */\nfunction updateUI(){\n  const u = S.user;\n  // topbar TON balance\n  const tonBal = u.tonBalance||0;\n  const tbEl = document.getElementById('tbCoins');\n  if(tbEl) tbEl.textContent = tonBal.toFixed(4);\n  const mineTopTon=document.getElementById('mineTopTon');\n  if(mineTopTon) mineTopTon.textContent=tonBal.toFixed(4)+' TON';\n  const gTon = document.getElementById('garageTonBal');\n  if(gTon) gTon.textContent = tonBal.toFixed(4);\n  updateRefUI();\n  renderWdHist();\n  renderWdHistNew();\n  syncFinanceHeader();\n}\n\n\n\n\n\n\n/* Tank upgrade modal */\n\nfunction showFab(){const f=document.getElementById('floatAddTask');if(f)f.style.display='flex';}\n\nfunction goNav(el){\n  // Always close any open profile subpage first so bottom nav works correctly\n  const subPage = document.getElementById('profileSubPage');\n  if(subPage && subPage.style.display !== 'none') {\n    subPage.style.display = 'none';\n  }\n  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));\n  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));\n  el.classList.add('active');\n  document.getElementById(el.dataset.s).classList.add('active');\n  hideFab();\n  if(el.dataset.s==='sectionFinance'){syncFinanceHeader();renderWdHistNew();if(typeof syncProfileTopbar==='function')syncProfileTopbar();}\n  if(el.dataset.s==='sectionHome'){renderBikes();syncTopbar();}\n  if(el.dataset.s==='sectionMarket'){renderGarage();}\n  if(el.dataset.s==='sectionFriends'){renderMiningPage(); if(typeof syncMineTopbar==='function') syncMineTopbar();}\n  if(el.dataset.s==='sectionTasks'&&typeof window._raceInit==='function'){\n    if(S&&S._dataLoaded) requestAnimationFrame(()=>requestAnimationFrame(window._raceInit));\n    else setTimeout(window._raceInit,60);\n  }\n}\n\n/* \u2550\u2550\u2550\u2550 MARKET \u2550\u2550\u2550\u2550 */\n\n\n\n\n\n/* \u2550\u2550\u2550\u2550 TASKS \u2550\u2550\u2550\u2550 */\nlet _socTab='partner';\nconst _taskInFlight=new Set(); // Fix 1: double-click guard\nconst BAM_IMG='<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463455/d7e19f8c-7876-4dc6-8542-d4f615704e46_mgohjd.png\" style=\"width:18px;height:18px;object-fit:contain;vertical-align:middle\">'; // Fix 7\n\n\n\n\n\n\n\nfunction switchRefTab(tab){\n  const aEl=document.getElementById('rtab-active');\n  const rEl=document.getElementById('rtab-regular');\n  if(aEl){\n    aEl.style.background   = tab==='active'  ? 'rgba(255,193,7,.18)'  : 'rgba(0,0,0,.55)';\n    aEl.style.border       = tab==='active'  ? '2px solid rgba(255,193,7,.55)' : '1px solid rgba(255,255,255,.1)';\n    aEl.style.color        = tab==='active'  ? 'var(--coin)' : 'rgba(255,255,255,.4)';\n  }\n  if(rEl){\n    rEl.style.background   = tab==='regular' ? 'rgba(124,179,66,.18)' : 'rgba(0,0,0,.55)';\n    rEl.style.border       = tab==='regular' ? '2px solid rgba(124,179,66,.55)' : '1px solid rgba(255,255,255,.1)';\n    rEl.style.color        = tab==='regular' ? 'var(--raseen)' : 'rgba(255,255,255,.4)';\n  }\n  document.getElementById('refActivePane').style.display  = tab==='active'  ? 'block':'none';\n  document.getElementById('refRegularPane').style.display = tab==='regular' ? 'block':'none';\n}\n\n\n\n\nasync \nasync \n\n/* \u2550\u2550\u2550\u2550 ADD TASK MODAL \u2550\u2550\u2550\u2550 */\nlet _atType='channel';\nconst TASK_COINS_PER_USER=60; // 100 users = 6,000 Coins | 500 users = 30,000 Coins\nconst MIN_TASK_TARGET=100;\nlet _submitInFlight=false; // Fix 1\n\n\n\n\nasync \n\n\n\nasync \n\n/* \u2550\u2550\u2550\u2550 EXCHANGE \u2550\u2550\u2550\u2550 */\n/* \u2550\u2550\u2550\u2550 EXCHANGE \u2550\u2550\u2550\u2550 */\nfunction swapMax(){\n  document.getElementById('swapFromAmt').value=Math.floor(S.user.raseen||0);\n  updSwapCalc();\n}\n\n\nlet _exchInFlight=false;\n\n\n\n/* \u2550\u2550\u2550\u2550 WITHDRAW \u2550\u2550\u2550\u2550 */\nfunction updWdPrev(){\n  const a=parseFloat(document.getElementById('wdAmt').value)||0;\n  document.getElementById('wdTonVal').textContent=(a*0.00001).toFixed(4);\n}\n\n\n\n\nfunction updateWdFeePreview(){\n  const amt=parseFloat(document.getElementById('wdAmtInput')?.value)||0;\n  const preview=document.getElementById('wdFeePreview');\n  const feeEl=document.getElementById('wdFeeAmt');\n  const netEl=document.getElementById('wdNetAmt');\n  const feeRow=document.getElementById('wdFeeRow');\n  if(!preview||!feeEl||!netEl) return;\n  const FREE_FEE_THRESHOLD=0.01;\n  if(amt>=0.0001){\n    if(amt>FREE_FEE_THRESHOLD){\n      const fee=+(amt*0.1).toFixed(8);\n      const net=+(amt-fee).toFixed(8);\n      feeEl.textContent=`-${fee.toFixed(4)} TON`;\n      netEl.textContent=`${net.toFixed(4)} TON`;\n      if(feeRow) feeRow.style.display='';\n    } else {\n      // No fee for small amounts\n      feeEl.textContent='-0.0000 TON';\n      netEl.textContent=`${amt.toFixed(4)} TON`;\n      if(feeRow) feeRow.style.display='none';\n    }\n    preview.style.display='block';\n  } else {\n    preview.style.display='none';\n  }\n}\n\nasync function doWithdraw(){\n  if(!debounce('withdraw')) return;\n  const addr=(document.getElementById('wdAddrInput')?.value||document.getElementById('wdAddr')?.value||'').trim();\n  const amt=parseFloat(document.getElementById('wdAmtInput')?.value||document.getElementById('wdAmt')?.value)||0;\n  const u=S.user;\n  if(!addr||addr.length<10){showNotif('Enter valid TON address!','e');return;}\n  if(amt<0.0001){showNotif('Min 0.0001 TON!','e');return;}\n  if(amt>(u.tonBalance||0)){showNotif('Not enough TON!','e');return;}\n\n  // Check for existing pending withdrawal\n  const hasPendingWd=(S.wdHist||[]).some(h=>h&&h.status==='pending');\n  if(hasPendingWd){showNotif('\u274c You already have a pending withdrawal. Please wait for it to be processed first.','e');return;}\n\n  // Partner-task withdrawal requirement removed (replaced with forced subscription at startup)\n\n  const FREE_FEE_THRESHOLD=0.01;\n  const feeAmt=amt>FREE_FEE_THRESHOLD?+(amt*0.10).toFixed(8):0;\n  const netAmt=+(amt-feeAmt).toFixed(8);\n\n  try{\n    // Get device fingerprint (hardware-based, survives VPN/IP change)\n    const fp = await getOrComputeFp();\n    const res=await api('withdraw',{address:addr,amount:amt});\n    u.tonBalance=res.tonBalance;\n    S.wdHist.unshift({amt:netAmt,amtRequested:amt,fee:feeAmt,address:addr,ts:Date.now(),status:'pending'});\n    if(document.getElementById('wdAddrInput')) document.getElementById('wdAddrInput').value='';\n    if(document.getElementById('wdAmtInput')) document.getElementById('wdAmtInput').value='';\n    if(document.getElementById('wdFeePreview')) document.getElementById('wdFeePreview').style.display='none';\n    syncTopbar(); syncFinanceHeader(); renderWdHistNew(); updateUI();\n    const lang=localStorage.getItem('pandaLang')||'en';\n    const successMsg={\n      ar:`\u2705 \u0637\u0644\u0628 \u0633\u062d\u0628 ${amt} TON${feeAmt>0?` \u2014 \u0631\u0633\u0648\u0645 10%: ${feeAmt} TON \u2014 \u0633\u062a\u0633\u062a\u0644\u0645: ${netAmt} TON`:''}`,\n      en:`\u2705 Withdrawal request: ${amt} TON${feeAmt>0?` \u2014 Fee 10%: ${feeAmt} TON \u2014 You get: ${netAmt} TON`:''}`,\n      ru:`\u2705 \u0417\u0430\u043f\u0440\u043e\u0441 \u0432\u044b\u0432\u043e\u0434\u0430: ${amt} TON${feeAmt>0?` \u2014 \u041a\u043e\u043c\u0438\u0441\u0441\u0438\u044f 10%: ${feeAmt} TON \u2014 \u041f\u043e\u043b\u0443\u0447\u0438\u0442\u0435: ${netAmt} TON`:''}`,\n      es:`\u2705 Retiro solicitado: ${amt} TON${feeAmt>0?` \u2014 Comisi\u00f3n 10%: ${feeAmt} TON \u2014 Recibir\u00e1s: ${netAmt} TON`:''}`,\n      fr:`\u2705 Retrait demand\u00e9: ${amt} TON${feeAmt>0?` \u2014 Frais 10%: ${feeAmt} TON \u2014 Vous recevrez: ${netAmt} TON`:''}`,\n    };\n    showNotif(successMsg[lang]||successMsg['en'],'s');\n  }catch(e){\n    const msg=e.message||'';\n    const errCode=e.errorCode||'';\n    if(errCode==='WALLET_USED'||msg.includes('WALLET_USED')||errCode==='MULTI_ACCOUNT'||msg.includes('MULTI_ACCOUNT')){\n      const lang=localStorage.getItem('pandaLang')||'en';\n      const T=TRANSLATIONS[lang]||TRANSLATIONS['en'];\n      showNotif(T.walletUsed||T.multiAccount||'\u26a0\ufe0f This wallet is already used by another account. Please use a different wallet address.','e');\n    } else {\n      showNotif(`\u274c ${msg}`,'e');\n    }\n    if(msg.includes('partner tasks')||msg.includes('PARTNER_TASKS')){\n      // missions page removed\n    }\n  }\n}\n\nfunction showDepositRequiredModal(){\n  const lang=localStorage.getItem('pandaLang')||'en';\n  const t=TRANSLATIONS[lang]||TRANSLATIONS['en'];\n  const isRtl=lang==='ar';\n\n  // Remove existing modal if any\n  const existing=document.getElementById('depositReqModal');\n  if(existing) existing.remove();\n\n  const modal=document.createElement('div');\n  modal.id='depositReqModal';\n  modal.style.cssText=`\n    position:fixed;inset:0;z-index:9999;\n    display:flex;align-items:center;justify-content:center;\n    background:rgba(0,0,0,.78);\n    animation:fi .25s ease;\n    padding:20px;\n  `;\n  modal.innerHTML=`\n    <div style=\"\n      background:linear-gradient(145deg,rgba(10,28,10,.97),rgba(6,18,6,.97));\n      border:1px solid rgba(239,83,80,.35);\n      border-radius:24px;\n      padding:28px 22px;\n      max-width:340px;width:100%;\n      text-align:center;\n      box-shadow:0 0 40px rgba(239,83,80,.2),0 20px 60px rgba(0,0,0,.6);\n      direction:${isRtl?'rtl':'ltr'};\n      position:relative;\n    \">\n      <!-- Close btn -->\n      <button onclick=\"document.getElementById('depositReqModal').remove()\" style=\"\n        position:absolute;top:14px;${isRtl?'left':'right'}:14px;\n        background:rgba(255,255,255,.08);border:none;border-radius:50%;\n        width:28px;height:28px;color:rgba(255,255,255,.5);font-size:16px;\n        cursor:pointer;display:flex;align-items:center;justify-content:center;\n      \">\u00d7</button>\n\n      <!-- Icon -->\n      <div style=\"font-size:56px;margin-bottom:14px;filter:drop-shadow(0 0 16px rgba(239,83,80,.5))\">\ud83d\udd12</div>\n\n      <!-- Title -->\n      <div style=\"font-size:18px;font-weight:800;color:#ff8a80;margin-bottom:10px;line-height:1.3\">\n        ${lang==='ar'?'\u0627\u0644\u0633\u062d\u0628 \u0645\u0642\u0641\u0644':'Withdrawal Locked'}\n      </div>\n\n      <!-- Divider -->\n      <div style=\"height:1px;background:linear-gradient(90deg,transparent,rgba(239,83,80,.3),transparent);margin-bottom:14px\"></div>\n\n      <!-- Body \u2014 3 lines -->\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:20px\">\n        <div style=\"\n          background:rgba(239,83,80,.07);border:1px solid rgba(239,83,80,.18);\n          border-radius:12px;padding:10px 12px;\n          font-size:13px;font-weight:700;color:#ff8a80;line-height:1.5;\n        \">\n          ${_depReqLine1(lang)}\n        </div>\n        <div style=\"\n          background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.18);\n          border-radius:12px;padding:10px 12px;\n          font-size:13px;font-weight:700;color:#00D4FF;line-height:1.5;\n        \">\n          ${_depReqLine2(lang)}\n        </div>\n        <div style=\"\n          background:rgba(124,179,66,.06);border:1px solid rgba(124,179,66,.18);\n          border-radius:12px;padding:8px 12px;\n          font-size:12px;font-weight:600;color:var(--muted);line-height:1.5;\n        \">\n          ${_depReqLine3(lang)}\n        </div>\n      </div>\n\n      <!-- CTA Button -->\n      <button onclick=\"document.getElementById('depositReqModal').remove();goToFinanceDeposit();\" style=\"\n        width:100%;padding:14px;\n        background:linear-gradient(135deg,#1a6ed8,#0d47a1);\n        border:none;border-radius:14px;\n        color:#fff;font-size:15px;font-weight:800;\n        cursor:pointer;\n        box-shadow:0 0 18px rgba(0,100,255,.4);\n        display:flex;align-items:center;justify-content:center;gap:8px;\n        font-family:'Fredoka',cursive;\n      \">\n        \ud83d\udc8e ${t.depositRequiredBtn||'Deposit Now'}\n      </button>\n    </div>\n  `;\n\n  // Auto-redirect after 4 seconds\n  const timer=setTimeout(()=>{\n    if(document.getElementById('depositReqModal')){\n      modal.remove();\n      goToFinanceDeposit();\n    }\n  }, 4000);\n\n  // Cancel auto-redirect if user closes manually\n  modal.querySelector('button[onclick*=\"remove\"]').addEventListener('click',()=>clearTimeout(timer));\n\n  document.body.appendChild(modal);\n  // Close on backdrop click\n  modal.addEventListener('click',e=>{if(e.target===modal){clearTimeout(timer);modal.remove();}});\n}\n\nfunction _depReqLine1(lang){\n  const m={\n    ar:'\u26d4 \u0627\u0644\u0633\u062d\u0628 \u0645\u062a\u0627\u062d \u0641\u0642\u0637 \u0644\u0644\u0645\u0633\u062a\u062e\u062f\u0645\u064a\u0646 \u0627\u0644\u0630\u064a\u0646 \u0642\u0627\u0645\u0648\u0627 \u0628\u0627\u0644\u0625\u064a\u062f\u0627\u0639',\n    en:'\u26d4 Withdrawals are only available for depositors',\n    ru:'\u26d4 \u0412\u044b\u0432\u043e\u0434 \u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u0434\u043b\u044f \u043f\u043e\u043f\u043e\u043b\u043d\u0438\u0432\u0448\u0438\u0445 \u0441\u0447\u0451\u0442',\n    es:'\u26d4 Los retiros solo est\u00e1n disponibles para quienes han depositado',\n    fr:'\u26d4 Les retraits sont r\u00e9serv\u00e9s aux utilisateurs ayant d\u00e9pos\u00e9',\n  };\n  return m[lang]||m['en'];\n}\nfunction _depReqLine2(lang){\n  const m={\n    ar:'\ud83d\udc8e \u0623\u0648\u062f\u0650\u0639 1 TON \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644 \u0644\u062a\u0641\u0639\u064a\u0644 \u0627\u0644\u0633\u062d\u0628',\n    en:'\ud83d\udc8e Deposit at least 1 TON to unlock withdrawals',\n    ru:'\ud83d\udc8e \u041f\u043e\u043f\u043e\u043b\u043d\u0438\u0442\u0435 \u0441\u0447\u0451\u0442 \u0445\u043e\u0442\u044f \u0431\u044b \u043d\u0430 1 TON \u0434\u043b\u044f \u0440\u0430\u0437\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u043a\u0438',\n    es:'\ud83d\udc8e Deposita al menos 1 TON para desbloquear los retiros',\n    fr:'\ud83d\udc8e Effectuez un d\u00e9p\u00f4t d\\'au moins 1 TON pour d\u00e9bloquer',\n  };\n  return m[lang]||m['en'];\n}\nfunction _depReqLine3(lang){\n  const m={\n    ar:'\ud83d\udd04 \u0633\u064a\u062a\u0645 \u062a\u0648\u062c\u064a\u0647\u0643 \u0644\u0635\u0641\u062d\u0629 \u0627\u0644\u0625\u064a\u062f\u0627\u0639 \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b \u062e\u0644\u0627\u0644 4 \u062b\u0648\u0627\u0646\u064d...',\n    en:'\ud83d\udd04 Redirecting to deposit page in 4 seconds...',\n    ru:'\ud83d\udd04 \u041f\u0435\u0440\u0435\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043d\u0430 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 \u043f\u043e\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f \u0447\u0435\u0440\u0435\u0437 4 \u0441\u0435\u043a\u0443\u043d\u0434\u044b...',\n    es:'\ud83d\udd04 Redirigiendo a la p\u00e1gina de dep\u00f3sito en 4 segundos...',\n    fr:'\ud83d\udd04 Redirection vers la page de d\u00e9p\u00f4t dans 4 secondes...',\n  };\n  return m[lang]||m['en'];\n}\nfunction renderWdHistNew(){\n  const el=document.getElementById('wdHistList');\n  if(!el) return;\n  const lang=localStorage.getItem('pandaLang')||'en';\n  const T=TRANSLATIONS[lang]||TRANSLATIONS['en'];\n  if(!S.wdHist||!S.wdHist.length){el.innerHTML=`<div class=\"hist-empty\">${T.noWithdrawals||'No withdrawals yet'}</div>`;return;}\n  el.innerHTML=S.wdHist.slice(0,20).map(h=>{\n    const rawStatus=(h.status||'pending').toLowerCase();\n    // failed and rejected both map to cancelled display; paid maps to approved\n    const normStatus=rawStatus==='paid'?'approved':rawStatus==='failed'?'cancelled':rawStatus==='rejected'?'cancelled':rawStatus;\n    const statusIcon={approved:'\u2705',pending:'\u23f3',cancelled:'\u274c'}[normStatus]||'\u23f3';\n    const statusText={\n      approved:T.wdStatusApproved||'Approved',\n      pending:T.wdStatusPending||'Pending',\n      cancelled:T.wdStatusCancelled||'Cancelled'\n    }[normStatus]||(normStatus.charAt(0).toUpperCase()+normStatus.slice(1));\n    const statusCls={approved:'approved',pending:'pending',cancelled:'cancelled'}[normStatus]||'pending';\n    const amtTon=h.amt||h.amount||0;\n    // Fee info \u2014 only show if there is a fee (amounts > 0.01 TON)\n    const feeLabel=T.wdFeeLabel||'Fee';\n    const requestedLabel=T.wdRequestedLabel||'Requested';\n    const feeInfo=h.fee&&h.fee>0?`<div style=\"font-size:9px;color:rgba(255,100,100,.7);font-weight:600\">${feeLabel}: -${h.fee} TON</div>`:'';\n    const requestedInfo=h.amtRequested&&h.amtRequested!==h.amt?`<div style=\"font-size:9px;color:rgba(255,255,255,.35);font-weight:600\">${requestedLabel}: ${h.amtRequested} TON</div>`:'';\n    const ts=h.ts||h.d||null;\n    const dateStr=ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'})+' \\u2022 '+new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'--';\n    const fullAddr=h.address||h.addr||'--';\n    const addrShort=fullAddr.length>28?fullAddr.slice(0,8)+'...'+fullAddr.slice(-6):fullAddr;\n    return `<div class=\"wd-new-hist-row\">\n      <div class=\"wd-new-hist-icon\">\n        <img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463497/toncoin-ton-logo_vpeeux.png\" alt=\"TON\" style=\"width:100%;height:100%;object-fit:cover;border-radius:50%\">\n      </div>\n      <div class=\"wd-new-hist-info\">\n        <div class=\"wd-new-hist-addr\">${addrShort}</div>\n        <div class=\"wd-new-hist-date\">${dateStr}</div>\n      </div>\n      <div class=\"wd-new-hist-right\">\n        <div class=\"wd-new-hist-amt\">${amtTon} TON</div>\n        ${requestedInfo}${feeInfo}\n        <span class=\"stat-badge-new ${statusCls}\">${statusIcon} ${statusText}</span>\n      </div>\n    </div>`;\n  }).join('');\n}\nfunction renderWdHist(){\n  const el=document.getElementById('wdHist');\n  if(!el) return;\n  if(!S.wdHist.length){el.innerHTML='<div class=\"hist-empty\">No withdrawals yet</div>';return;}\n  el.innerHTML=S.wdHist.slice(0,20).map((h,idx)=>{\n    // Normalise legacy status values from old DB records\n    const rawStatus = (h.status||'pending').toLowerCase();\n    const normStatus = rawStatus==='paid'?'approved' : rawStatus==='failed'?'rejected' : rawStatus;\n    const sc={approved:'sb-approved',pending:'sb-pending',rejected:'sb-rejected'}[normStatus]||'sb-pending';\n    const statusIcon={approved:'\u2705',pending:'\u23f3',rejected:'\u274c'}[normStatus]||'\u23f3';\n    const statusColor={approved:'var(--neon-green)',pending:'var(--coin)',rejected:'#ff8a80'}[normStatus]||'var(--coin)';\n    const statusText={approved:'Approved',pending:'Pending',rejected:'Rejected'}[normStatus]||normStatus.charAt(0).toUpperCase()+normStatus.slice(1);\n    const tonVal=((h.amt||0)*0.00001).toFixed(4);\n    const amt=h.amt||0;\n    // Fix date: always use en-US locale to avoid RTL/Arabic date display issues\n    const ts=h.ts||null;\n    const dateStr=ts\n      ? new Date(ts).toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'})\n      : (h.d ? new Date(h.d).toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}) : '\u2014');\n    return`<div style=\"background:linear-gradient(135deg,rgba(6,20,6,.9),rgba(0,0,0,.6));border:1px solid rgba(255,215,0,.2);border-radius:16px;padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.4)\">\n      <!-- glow line top -->\n      <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,${statusColor},transparent);opacity:.6\"></div>\n      <!-- Row 1: amount + status -->\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-size:22px\">\ud83d\udcb8</span>\n          <div>\n            <div style=\"font-size:22px;font-weight:800;color:var(--coin);line-height:1\">${fmt(amt)}</div>\n            <div style=\"font-size:10px;color:var(--muted);font-weight:600;margin-top:1px\">Coins</div>\n          </div>\n        </div>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px\">\n          <span class=\"stat-badge ${sc}\" style=\"font-size:11px;padding:4px 12px\">${statusIcon} ${statusText}</span>\n        </div>\n      </div>\n      <!-- Divider -->\n      <div style=\"height:1px;background:rgba(255,255,255,.06);margin-bottom:10px\"></div>\n      <!-- Row 2: details \u2014 TON / Date / Coins value -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px\">\n        <div style=\"background:rgba(0,0,0,.3);border-radius:10px;padding:7px 9px;text-align:center\">\n          <div style=\"font-size:9px;color:var(--muted);font-weight:600;margin-bottom:2px\">\ud83d\udc8e TON</div>\n          <div style=\"font-size:13px;font-weight:800;color:#00D4FF\">${tonVal}</div>\n        </div>\n        <div style=\"background:rgba(0,0,0,.3);border-radius:10px;padding:7px 9px;text-align:center\">\n          <div style=\"font-size:9px;color:var(--muted);font-weight:600;margin-bottom:2px\">\ud83d\udcc5 Date</div>\n          <div style=\"font-size:11px;font-weight:800;color:var(--text);direction:ltr\">${esc(dateStr)}</div>\n        </div>\n        <div style=\"background:rgba(0,0,0,.3);border-radius:10px;padding:7px 9px;text-align:center\">\n          <div style=\"font-size:9px;color:var(--muted);font-weight:600;margin-bottom:2px\">\ud83e\ude99 Amount</div>\n          <div style=\"font-size:13px;font-weight:800;color:var(--coin)\">${fmt(amt)}</div>\n        </div>\n      </div>\n    </div>`;\n  }).join('');\n}\n\n/* \u2550\u2550\u2550\u2550 FINANCE NAV \u2550\u2550\u2550\u2550 */\nfunction switchFinTab(el,t){ /* legacy - redirect to openProfilePage */ openProfilePage(t); }\n\nfunction openProfilePage(page){\n  const titleKeys = {\n    deposit:'pspTitleDeposit', withdraw:'pspTitleWithdraw',\n    missions:'pspTitleMissions', partnership:'pspTitlePartnership',\n    referrals:'pspTitleReferrals',\n    market:'pspTitleMarket', ridemode:'pspTitleRideMode', bikeskins:'pspTitleBikeSkins'\n  };\n  const balLabelKeys = {\n    deposit:'pspBalLblBalance', withdraw:'pspBalLblAvailable',\n    missions:'pspBalLblAvailable', referrals:'pspBalLblAvailable',\n    partnership:'pspBalLblEarned',\n    market:'pspBalLblBalance', ridemode:'pspBalLblBalance', bikeskins:'pspBalLblBalance'\n  };\n  const overlay = document.getElementById('profileSubPage');\n  const content = document.getElementById('profileSubPageContent');\n  const title   = document.getElementById('profileSubPageTitle');\n  if(!overlay||!content) return;\n  const src = document.getElementById('page-'+page+'-content');\n  if(!src) return;\n  content.innerHTML = src.innerHTML;\n  const _csNames = {market:'\ud83d\uded2 Market', ridemode:'\ud83c\udfc1 Ride Mode', bikeskins:'\ud83c\udfa8 Bike Skins'};\n  title.innerHTML = tr(titleKeys[page]||'') || _csNames[page] || page;\n  title.setAttribute('data-i18n', titleKeys[page]||'');\n  overlay.setAttribute('data-page', page);\n  // Sync topbar user info + balance\n  try{\n    const av = document.getElementById('pspAvatar');\n    const srcAv = document.getElementById('pfAvatar');\n    if(av && srcAv) av.innerHTML = srcAv.innerHTML;\n    const nm = document.getElementById('pspUserName');\n    const srcNm = document.getElementById('pfUserName');\n    if(nm){\n      // username text node only (the ::after dot is CSS)\n      nm.textContent = (srcNm && srcNm.textContent) ? srcNm.textContent : 'Player';\n    }\n    const lbl = document.getElementById('pspBalLbl');\n    if(lbl){\n      lbl.textContent = tr(balLabelKeys[page]||'pspBalLblBalance');\n      lbl.setAttribute('data-i18n', balLabelKeys[page]||'pspBalLblBalance');\n    }\n    const bv = document.getElementById('pspBalVal');\n    const srcBv = document.getElementById('finTonBal');\n    if(bv){\n      if(page==='partnership'){\n        // Total earned from partnership posts (approved sum) or fallback\n        let earned = 0;\n        try{ (S.partnerPosts||[]).forEach(p=>{ if(p.status==='approved') earned += (+p.reward||0); }); }catch(e){}\n        bv.textContent = earned ? earned.toFixed(4) : '0.0000';\n      } else {\n        bv.textContent = (srcBv && srcBv.textContent) ? srcBv.textContent : '0.0000';\n      }\n    }\n  }catch(e){}\n  overlay.style.display='block';\n  overlay.scrollTop = 0;\n  if(page==='missions'&&typeof renderMissions==='function'){renderMissions();}\n  else if(page==='partnership'&&typeof renderPartnerPosts==='function'){renderPartnerPosts();}\n  else if(page==='referrals'){renderRefMissions();updateRefUI();}\n  else if(page==='withdraw'||page==='deposit'){syncFinanceHeader();renderWdHistNew();}\n  const cidEl=document.getElementById('manualCommentId');\n  if(cidEl) cidEl.value=JSON.stringify({user_id:String(S.userId||'???'),TG:\"RaseenRacing_bot\"});\n  // Re-apply translations to the freshly-injected content so all data-i18n nodes are localized\n  try{ if(typeof applyLang==='function'){ const lang=localStorage.getItem('pandaLang')||'en'; const flag=localStorage.getItem('pandaLangFlag')||'\ud83c\uddec\ud83c\udde7'; const code=localStorage.getItem('pandaLangCode')||'EN'; applyLang(lang,flag,code); } }catch(e){}\n}\n\nfunction closeProfilePage(){\n  const overlay = document.getElementById('profileSubPage');\n  if(overlay) overlay.style.display='none';\n}\n\nfunction copyText(id){\n  const el=document.getElementById(id);\n  if(!el) return;\n  try{\n    navigator.clipboard.writeText(el.value||el.textContent||'').then(()=>showNotif('\u2705 Copied!','s')).catch(()=>showNotif('\u274c Copy failed','e'));\n  }catch(e){showNotif('\u274c Copy failed','e');}\n}\n\nfunction goToFinanceDeposit(){\n  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));\n  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));\n  const fn=document.querySelector('.ni[data-s=\"sectionFinance\"]');\n  if(fn) fn.classList.add('active');\n  document.getElementById('sectionFinance').classList.add('active');\n  openProfilePage('deposit');\n}\nfunction goToFinanceWithdraw(){\n  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));\n  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));\n  const fn=document.querySelector('.ni[data-s=\"sectionFinance\"]');\n  if(fn) fn.classList.add('active');\n  document.getElementById('sectionFinance').classList.add('active');\n  openProfilePage('withdraw');\n}\n\n/* \u2550\u2550\u2550\u2550 REFERRAL \u2550\u2550\u2550\u2550 */\nfunction updateRefUI(){\n  // Fix 7: use bot app deep link\n  const link=`${CFG.BOT_APP_LINK}?startapp=${encodeURIComponent(S.userId||'000')}`;\n  const refEl=document.getElementById('refLinkInp');\n  if(refEl) refEl.value=link;\n  const cntEl=document.getElementById('totalRefsDisp');\n  if(cntEl) cntEl.textContent=`${S.refs.length} Friends`;\n  // Update new ref2 stats and list\n  if(typeof updateRef2Stats==='function') updateRef2Stats();\n  if(typeof renderRef2List==='function') renderRef2List();\n}\nfunction copyRefLink(){\n  const v=document.getElementById('refLinkInp').value;\n  navigator.clipboard.writeText(v)\n    .then(()=>showNotif('\u2705 Link copied!','s'))\n    .catch(()=>{document.getElementById('refLinkInp').select();document.execCommand('copy');showNotif('\u2705 Link copied!','s');});\n}\n\n/* \u2550\u2550\u2550\u2550 DEPOSIT PREVIEW \u2550\u2550\u2550\u2550 */\nconst TON_TO_RASEEN=50000;\nfunction setDepAmt(v){document.getElementById('depositAmountInput').value=Math.max(1,v);updDepPreview();}\nfunction updDepPreview(){\n  const ton=parseFloat(document.getElementById('depositAmountInput')?.value)||0;\n  const tonIcon='<img src=\"https://res.cloudinary.com/dktppfipy/image/upload/v1778463497/toncoin-ton-logo_vpeeux.png\" style=\"width:20px;height:20px;border-radius:50%;object-fit:cover\">';\n  const el=document.getElementById('depTonPreview');\n  if(el) el.innerHTML=`${tonIcon} ${ton>0?ton.toFixed(4):'0'} TON`;\n  // enable/disable submit button\n  const walletConnected=!!S.wallet;\n  const btn=document.getElementById('submitDepositBtn');\n  if(btn) btn.disabled=(ton<1||!walletConnected);\n}\n\n/* \u2550\u2550\u2550\u2550 TON CONNECT \u2550\u2550\u2550\u2550 */\nasync function initTON(){\n  try{\n    if(window.TON_CONNECT_UI){\n      S.tonUI=new TON_CONNECT_UI.TonConnectUI({\n        manifestUrl:`${CFG.API_URL}/tonconnect-manifest.json`,\n        uiPreferences:{theme:'DARK'}\n      });\n      S.tonUI.onStatusChange(w=>w?onWConn(w):onWDisc());\n      setTimeout(()=>{if(S.tonUI.connected)S.tonUI.getWallets();},500);\n    }\n  }catch(e){console.error('TON:',e);}\n}\nfunction onWConn(w){\n  S.wallet={address:w.account.address,chain:w.account.chain,appName:w.device.appName};\n  const sh=`${S.wallet.address.substring(0,6)}...${S.wallet.address.slice(-4)}`;\n  const wad = document.getElementById('walletAddressDisplay');\n  if(wad){ wad.innerHTML=`${sh}<span class=\"conn-dot\"></span><span class=\"conn-lbl\">Connected</span>`; wad.classList.add('is-connected'); wad.dataset.connected='1'; }\n  const connBtn = document.getElementById('connectWalletBtn');\n  if(connBtn){ connBtn.innerHTML='<i class=\"fas fa-unlink\"></i> Disconnect'; connBtn.onclick=disconnectWallet; connBtn.classList.add('is-disconnect'); }\n  // Fill withdraw address input with full wallet address\n  const wdAddr = document.getElementById('wdAddrInput');\n  if(wdAddr && !wdAddr.value) wdAddr.value = S.wallet.address;\n  updDepPreview();\n}\nfunction onWDisc(){\n  S.wallet=null;\n  const wad = document.getElementById('walletAddressDisplay');\n  if(wad){ wad.innerHTML='Not connected<span class=\"conn-dot\"></span><span class=\"conn-lbl\">Connected</span>'; wad.classList.remove('is-connected'); delete wad.dataset.connected; }\n  const connBtn = document.getElementById('connectWalletBtn');\n  if(connBtn){ connBtn.innerHTML='<i class=\"fas fa-plug\"></i> Connect'; connBtn.onclick=connectWallet; connBtn.classList.remove('is-disconnect'); }\n  const btn = document.getElementById('submitDepositBtn');\n  if(btn) btn.disabled=true;\n}\nasync function connectWallet(){if(S.tonUI)await S.tonUI.openModal();}\nasync function disconnectWallet(){if(S.tonUI)await S.tonUI.disconnect();}\n\nwindow.initiateDeposit=async function(){\n  if(!S.wallet){alert('Connect wallet first');return;}\n  const amt=parseFloat(document.getElementById('depositAmountInput').value);\n  if(!amt||amt<1){alert('Minimum 1 TON');return;}\n  if(amt>1000){alert('Amount too large');return;}\n  try{\n    const comment=JSON.stringify({user_id:String(S.userId),TG:\"RaseenRacing_bot\"});\n    const nano=String(Math.floor(amt*1e9));\n    if(!window.TonWeb) throw new Error('TonWeb not loaded');\n    const TW=window.TonWeb; new TW();\n    const cell=new TW.boc.Cell();\n    cell.bits.writeUint(0,32); cell.bits.writeString(comment);\n    const boc=await cell.toBoc(false);\n    const payload=TW.utils.bytesToBase64(boc);\n    const tx={validUntil:Math.floor(Date.now()/1000)+600,messages:[{address:CFG.DEPOSIT_WALLET,amount:nano,payload}]};\n    const result=await S.tonUI.sendTransaction(tx);\n    // Show pending message \u2014 balance will be credited by server within 3 minutes\n    const sd=document.getElementById('depositStatus');\n    sd.classList.add('visible');\n    sd.querySelector('.txsi').innerHTML='\u23f3';\n    sd.querySelector('.txsm').innerHTML='Transaction sent!';\n    document.getElementById('depositStatusDetail').textContent='Your balance will be added to your account within 3 minutes.';\n    showNotif('\u2705 Transaction sent! Balance will be credited within 3 minutes','s');\n    // Register deposit in DB (fire and forget \u2014 server monitors wallet independently)\n    try{ await api('deposit',{amount:amt,txHash:result.boc,comment}); }catch(_){}\n  }catch(e){\n    const sd=document.getElementById('depositStatus');\n    sd.classList.add('visible');\n    sd.querySelector('.txsi').innerHTML='\u274c';\n    sd.querySelector('.txsm').innerHTML=e.message?.includes('rejected')?'Transaction rejected':'Transaction failed';\n    document.getElementById('depositStatusDetail').textContent=e.message||'Please try again';\n  }\n};\nasync function handleDepOk(result,amt,comment){\n  try{\n    const d=await api('deposit',{amount:amt,txHash:result.boc,comment});\n    const sd=document.getElementById('depositStatus');\n    sd.classList.add('visible');\n    sd.querySelector('.txsi').innerHTML='\u23f3';\n    sd.querySelector('.txsm').innerHTML='Transaction sent!';\n    document.getElementById('depositStatusDetail').textContent='Waiting for confirmation (~1 min)...';\n    startDepVerify(d.depositId,result.boc);\n  }catch(e){console.error(e);}\n}\nfunction startDepVerify(depId,txHash){\n  if(S.depCheckInt) clearInterval(S.depCheckInt);\n  if(!depId) return;\n  let attempts=0;\n  const prevRaseen = S.user?.raseen||0;\n  S.depCheckInt=setInterval(async()=>{\n    attempts++;\n    try{\n      // Poll getState \u2014 \u0627\u0644\u0633\u064a\u0631\u0641\u0631 \u0627\u0644\u062e\u0627\u0631\u062c\u064a \u0647\u064a\u0636\u064a\u0641 \u0627\u0644\u0631\u0635\u064a\u062f \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b\n      const r=await api('getState',{});\n      if(r && r.user && r.user.raseen > prevRaseen){\n        clearInterval(S.depCheckInt);\n        const diff = r.user.raseen - prevRaseen;\n        const sd=document.getElementById('depositStatus');\n        if(sd){\n          sd.querySelector('.txsi').innerHTML='\u2705';\n          sd.querySelector('.txsm').innerHTML='Deposit confirmed!';\n          document.getElementById('depositStatusDetail').textContent=`+${diff.toLocaleString()} Raseen added`;\n        }\n        showNotif(`\ud83d\udcb0 Deposit confirmed! +${diff.toLocaleString()} Raseen`,'s');\n        loadState();\n        setTimeout(()=>sd&&sd.classList.remove('visible'),3000);\n      }\n    }catch(e){}\n    if(attempts>=36) clearInterval(S.depCheckInt); // \u062a\u0648\u0642\u0641 \u0628\u0639\u062f 6 \u062f\u0642\u0627\u064a\u0642\n  },10000);\n}\n\n/* \u2550\u2550\u2550\u2550 MODALS \u2550\u2550\u2550\u2550 */\nfunction openModal(id){\n  if(id==='upgradeModal') \"\";\n  else if(id==='infoModal') buildInfoContent();\n  document.getElementById(id).classList.add('active');\n}\nfunction closeModal(id){document.getElementById(id).classList.remove('active');}\ndocument.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('active');}));\n\n\n/* \u2550\u2550\u2550\u2550 HELPERS \u2550\u2550\u2550\u2550 */\nfunction fmt(n){\n  n=Math.floor(n||0);\n  if(n>=1000000) return(n/1000000).toFixed(1)+'M';\n  if(n>=1000)    return(n/1000).toFixed(1)+'K';\n  return n.toString();\n}\nlet _nt;\nfunction showNotif(msg,type='i'){\n  const el=document.getElementById('notif');\n  if(!el) return;\n  el.innerHTML=msg; el.className=`notif show ${type}`;\n  clearTimeout(_nt); _nt=setTimeout(()=>el.classList.remove('show'),3200);\n}\n\n\nfunction pandaClick(){\n  const p=document.getElementById('pandaChar');\n  if(p){p.style.transition='transform .12s';p.style.transform='scale(.86) rotate(9deg)';setTimeout(()=>{p.style.transform='';},220);}\n  spawnPtc();\n}\n\n/* \u2550\u2550\u2550\u2550 LOADING SCREEN \u2550\u2550\u2550\u2550 */\nfunction ldProgress(pct, msg){\n  pct = Math.max(0, Math.min(100, pct));\n  // Drive legacy bar (hidden)\n  const fill = document.getElementById('ldBarFill');\n  if(fill) fill.style.width = Math.round(pct) + '%';\n  // New blue segmented bar (build once)\n  const SEG_COUNT = 20;\n  const host = document.getElementById('ldSegsNew');\n  if(host && host.childElementCount !== SEG_COUNT){\n    host.innerHTML = '';\n    for(let i=0;i<SEG_COUNT;i++){ const d=document.createElement('div'); d.className='seg'; host.appendChild(d); }\n  }\n  if(host){\n    const filled = Math.round((pct/100)*SEG_COUNT);\n    host.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('active', i<filled));\n  }\n  // Legacy segments compatibility\n  const segs = document.querySelectorAll('#ldSegs .ld-seg');\n  const filledLegacy = Math.round((pct / 100) * segs.length);\n  segs.forEach((s, i) => { if(i < filledLegacy) s.classList.add('active'); else s.classList.remove('active'); });\n  const pctEl = document.getElementById('ldPct');\n  if(pctEl){ pctEl.textContent = Math.round(pct) + '%'; pctEl.style.color=''; }\n  const stat = document.getElementById('ldStatus');\n  if(stat){ stat.textContent = 'Loading'; stat.style.color = ''; }\n}\nfunction ldHide(){\n  const s = document.getElementById('loadingScreen');\n  if(s){ s.classList.add('hidden'); setTimeout(()=>s.remove(), 700); }\n}\nfunction ldError(msg, retryLabel){\n  retryLabel = retryLabel || '\ud83d\udd04 Retry';\n  const stat = document.getElementById('ldStatus');\n  if(stat){\n    stat.innerHTML = msg.replace(/\\n/g,'<br>');\n    stat.style.color = '#ff8a80';\n    stat.style.lineHeight = '1.7';\n  }\n  // Turn all segments red\n  document.querySelectorAll('#ldSegs .ld-seg').forEach(s=>{\n    s.classList.add('active');\n    s.style.background = 'linear-gradient(180deg,#ef5350,#b71c1c)';\n    s.style.borderColor = 'rgba(239,83,80,.8)';\n    s.style.boxShadow   = '0 0 10px rgba(239,83,80,.6)';\n  });\n  const pctEl = document.getElementById('ldPct');\n  if(pctEl){ pctEl.textContent = '\u26a0\ufe0f'; pctEl.style.color = '#ff8a80'; }\n  // Add retry button inside loading screen \u2014 DO NOT hide the screen\n  const ld = document.getElementById('loadingScreen');\n  if(ld && !document.getElementById('ldRetryBtn')){\n    const btn = document.createElement('button');\n    btn.id = 'ldRetryBtn';\n    btn.textContent = retryLabel;\n    btn.style.cssText = 'margin-top:22px;padding:12px 32px;background:linear-gradient(135deg,#ef5350,#b71c1c);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:Fredoka,cursive;box-shadow:0 4px 16px rgba(239,83,80,.5);';\n    btn.onclick = ()=>{ location.reload(); };\n    ld.appendChild(btn);\n  }\n  // \u26d4 Loading screen stays visible \u2014 app NEVER opens with zero data\n}\n\n// Preload all item images + panda image\nfunction preloadImages(){\n  const urls=[\n    '',\n    BAM_URL,\n    ...ITEMS.map(i=>i.iconUrl),\n    ...BIKES.map(b=>b.img),\n  ];\n  return Promise.all(urls.map(u=>new Promise(res=>{\n    const img=new Image();img.onload=img.onerror=res;img.src=u;\n  })));\n}\n\n/* \u2550\u2550\u2550\u2550 INIT \u2550\u2550\u2550\u2550 */\nwindow.addEventListener('load',init);\n\n// Smoothly animate progress to a target value\nfunction ldAnimateTo(targetPct, msg, duration=600){\n  const start = parseInt(document.getElementById('ldPct')?.textContent||'0');\n  const steps = 30;\n  const stepTime = duration / steps;\n  let step = 0;\n  return new Promise(resolve=>{\n    const iv = setInterval(()=>{\n      step++;\n      const pct = start + (targetPct - start) * (step/steps);\n      ldProgress(pct, msg);\n      if(step >= steps){ clearInterval(iv); ldProgress(targetPct, msg); resolve(); }\n    }, stepTime);\n  });\n}\n\nasync function init(){\n  // Helper: get current lang translation\n  function lt(key){ const lang=localStorage.getItem('pandaLang')||'en'; return (TRANSLATIONS[lang]||TRANSLATIONS['en'])[key]||TRANSLATIONS['en'][key]||key; }\n\n  // Record start time \u2014 minimum loading time\n  const startTime = Date.now();\n  const MIN_LOADING_MS = 200;\n\n  // Step 1: Telegram setup\n  ldProgress(0, lt('ldLoading'));\n  if(window.Telegram?.WebApp){\n    S.tg=window.Telegram.WebApp;\n    S.tg.ready(); S.tg.expand();\n    const u=S.tg.initDataUnsafe?.user;\n    if(u){\n      S.userId=String(u.id);\n      // Auto-detect Telegram user language if no saved preference\n      if(!localStorage.getItem('pandaLang') && u.language_code){\n        const tgLang=u.language_code.toLowerCase().slice(0,2);\n        const supported={ar:['\ud83c\uddf8\ud83c\udde6','AR'],en:['\ud83c\uddec\ud83c\udde7','EN'],ru:['\ud83c\uddf7\ud83c\uddfa','RU'],es:['\ud83c\uddea\ud83c\uddf8','ES'],fr:['\ud83c\uddeb\ud83c\uddf7','FR']};\n        if(supported[tgLang]){\n          localStorage.setItem('pandaLang',tgLang);\n          localStorage.setItem('pandaLangFlag',supported[tgLang][0]);\n          localStorage.setItem('pandaLangCode',supported[tgLang][1]);\n        }\n      }\n      // Set avatar in new topbar\n      const hubAv=document.getElementById('hubAvatar');\n      if(hubAv && u.photo_url){\n        hubAv.innerHTML=`<img src=\"${esc(u.photo_url)}\" onerror=\"this.parentElement.innerHTML='<span>\ud83c\udfcd\ufe0f</span>'\">`;\n      }\n      // Set username in new topbar \u2014 show Telegram first name\n      const hubName=document.getElementById('hubUserName');\n      if(hubName){\n        const firstName=u.first_name||'';\n        const lastName=u.last_name||'';\n        const username=u.username||'';\n        const displayName=(firstName+' '+lastName).trim()||username||'Player';\n        hubName.textContent=displayName;\n        S._tgName=displayName; // save for updateUI\n      }\n      // Legacy uavatar\n      if(u.photo_url){\n        const av=document.getElementById('uavatar');\n        if(av) av.innerHTML=`<img src=\"${esc(u.photo_url)}\" onerror=\"this.parentElement.innerHTML='<div class=ap>\ud83c\udfcd\ufe0f</div>'\">`;\n      }\n    }\n    S.startParam=(\n      S.tg.initDataUnsafe?.start_param ||\n      S.tg.initDataUnsafe?.startParam  ||\n      ''\n    ).toString().replace(/\\D/g,'');\n  }\n  await ldAnimateTo(10, lt('ldConnecting'), 300);\n\n  // Step 1.5: Race servers \u2014 find fastest live server (non-blocking)\n  const authHdrForServer = S.tg?.initData ? `Telegram ${S.tg.initData}` : null;\n  const serverPromise = window._raceServersNow(authHdrForServer).catch(()=>{});\n\n  // Step 2: Preload images (parallel with server detection)\n  await ldAnimateTo(20, lt('ldAssets'), 300);\n  await Promise.all([\n    preloadImages().catch(()=>{}),\n    serverPromise,\n  ]);\n  await ldAnimateTo(40, lt('ldAssetsOk'), 200);\n\n  // Step 3: Load user data\n  await ldAnimateTo(50, lt('ldConnecting'), 300);\n  let loaded = false;\n  let attempts = 0;\n  const MAX_ATTEMPTS = 3;\n  while(!loaded && attempts < MAX_ATTEMPTS){\n    attempts++;\n    try{\n      ldProgress(50 + attempts*5, attempts===1 ? lt('ldConnected') : `${lt('ldRetrying')} (${attempts}/${MAX_ATTEMPTS})`);\n      await loadState();\n      if(S.user && S.userId) loaded=true;\n      else throw new Error('No user data');\n    }catch(e){\n      console.warn(`Attempt ${attempts} failed:`,e.message);\n      if(attempts < MAX_ATTEMPTS){\n        ldProgress(50 + attempts*5, `${lt('ldBusy')} (${attempts}/${MAX_ATTEMPTS})`);\n        await new Promise(r=>setTimeout(r,1500*attempts));\n      }\n    }\n  }\n  if(!loaded){\n    ldError(lt('ldErrorMsg'), lt('ldRetryBtn'));\n    return;\n  }\n  await ldAnimateTo(70, lt('ldConnected'), 300);\n\n  // Step 3.5: Preload owned bike images with priority\n  await ldAnimateTo(72, '\ud83c\udfcd\ufe0f Loading your bikes...', 200);\n  try{\n    const ownedLvs = S.user?.ownedBikes || [];\n    if(ownedLvs.length > 0){\n      const bikeImgs = ownedLvs.map(lv=>{ const b=BIKES.find(x=>x.lv===lv); return b?b.img:null; }).filter(Boolean);\n      await Promise.all(bikeImgs.map(u=>new Promise(res=>{\n        const img=new Image(); img.onload=img.onerror=res; img.src=u;\n      })));\n    }\n  }catch(e){ console.warn('bike preload:',e.message); }\n\n  // Step 4: Render UI\n  await ldAnimateTo(85, lt('ldBuilding'), 200);\n  try{ renderGarage(); }catch(e){ console.warn('renderGarage:',e.message); }\n  try{ renderTasks(); }catch(e){ console.warn('renderTasks:',e.message); }\n  try{ renderBikes(); }catch(e){ console.warn('renderBikes:',e.message); }\n  // Pre-build race carousel so bikes appear instantly when user opens race section\n  try{ if(typeof window._raceInit==='function') window._raceInit(); }catch(e){ console.warn('_raceInit:',e.message); }\n  syncTopbar();\n  // Also sync Farm page topbar so user data appears immediately on first open\n  try{ if(typeof syncMineTopbar === 'function') syncMineTopbar(); }catch(e){}\n  try{ if(typeof syncProfileTopbar === 'function') syncProfileTopbar(); }catch(e){}\n\n  // Step 5: Init TON + timers\n  await ldAnimateTo(95, lt('ldWallet'), 150);\n  setTimeout(()=>initTON(), 300);\n  // Pre-compute device fingerprint in background\n  getOrComputeFp().catch(()=>{});\n  setInterval(()=>{ loadState(); }, 180000);\n\n  await ldAnimateTo(100, lt('ldReady'), 150);\n\n  // Ensure minimum loading time (5-10s feel)\n  const elapsed = Date.now() - startTime;\n  if(elapsed < MIN_LOADING_MS){\n    await new Promise(r=>setTimeout(r, MIN_LOADING_MS - elapsed));\n  }\n\n  setTimeout(()=>ldHide(), 700);\n  setTimeout(()=>{ if(typeof window.__checkForcedSub==='function') window.__checkForcedSub(); }, 900);\n  // Apply saved language after UI ready\n  const savedLang = localStorage.getItem('pandaLang');\n  if(savedLang){\n    const meta = {ar:['\ud83c\uddf8\ud83c\udde6','AR'],en:['\ud83c\uddec\ud83c\udde7','EN'],ru:['\ud83c\uddf7\ud83c\uddfa','RU'],es:['\ud83c\uddea\ud83c\uddf8','ES'],fr:['\ud83c\uddeb\ud83c\uddf7','FR']};\n    if(meta[savedLang]) applyLang(savedLang, meta[savedLang][0], meta[savedLang][1]);\n  }\n}\n\n/* \u2550\u2550\u2550\u2550 LANGUAGE SYSTEM \u2550\u2550\u2550\u2550 */\nconst TRANSLATIONS = {\n  ar:{\n    navHome:'\u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629',navMarket:'\u0627\u0644\u062c\u0631\u0627\u062c',navTasks:'\u0627\u0644\u0633\u0628\u0627\u0642',navFriends:'\u0627\u0644\u0645\u0632\u0631\u0639\u0629',na \n  const a = _bgMusicEl(); if(!a) return;\n  try{ a.volume = 0.35; a.play().catch(()=>{}); }catch(e){}\n}\nfunction _pauseBgMusic(){\n  const a = _bgMusicEl(); if(!a) return;\n  try{ a.pause(); }catch(e){}\n}\nfunction toggleSound(){\n  _soundEnabled = !_soundEnabled;\n  localStorage.setItem('soundEnabled', _soundEnabled ? '1' : '0');\n  const btn = document.getElementById('soundBtn');\n  if(btn) btn.textContent = _soundEnabled ? '\ud83d\udd0a' : '\ud83d\udd07';\n  if(_soundEnabled) _playBgMusic(); else _pauseBgMusic();\n  if(typeof showNotif==='function') showNotif(_soundEnabled ? '\ud83d\udd0a Music ON' : '\ud83d\udd07 Music OFF', 'w');\n}\n// Init sound button + try autoplay; fallback: start on first user gesture\ndocument.addEventListener('DOMContentLoaded', ()=>{\n  const btn = document.getElementById('soundBtn');\n  if(btn) btn.textContent = _soundEnabled ? '\ud83d\udd0a' : '\ud83d\udd07';\n  if(_soundEnabled){\n    _playBgMusic();\n    const startOnGesture = ()=>{\n      if(_soundEnabled) _playBgMusic();\n      document.removeEventListener('click', startOnGesture);\n      document.removeEventListener('touchstart', startOnGesture);\n    };\n    document.addEventListener('click', startOnGesture, {once:false});\n    document.addEventListener('touchstart', startOnGesture, {once:false});\n  }\n});\n\nfunction toggleLangMenu(){\n  const m=document.getElementById('langMenu');\n  if(!m) return;\n  const willOpen = m.style.display==='none' || m.style.display==='';\n  m.style.display = willOpen ? 'block' : 'none';\n  if(willOpen){\n    setTimeout(()=>document.addEventListener('click',closeLangMenuOutside,{once:true}),10);\n  }\n}\nfunction closeLangMenuOutside(e){\n  const m=document.getElementById('langMenu'); if(!m) return;\n  const btn=document.getElementById('langBtn');\n  const btnFin=document.getElementById('langBtnFin');\n  if(m.contains(e.target)) return;\n  if(btn && btn.contains(e.target)) return;\n  if(btnFin && btnFin.contains(e.target)) return;\n  m.style.display='none';\n}\nfunction setLang(lang,flag,code){\n  try{\n    localStorage.setItem('pandaLang',lang);\n    localStorage.setItem('pandaLangFlag',flag);\n    localStorage.setItem('pandaLangCode',code);\n    applyLang(lang,flag,code);\n    // Save language to server so bot notifications arrive in the right language\n    if(typeof api==='function') api('saveLanguage',{lang}).catch(()=>{});\n    // Refresh any open modals so their inner text re-translates immediately\n    try{\n      const bd = document.getElementById('bikeDetailOverlay');\n      if(bd && bd.classList.contains('open')){\n        // Re-open with current selected bike level (sheet has buy btn with data-lv? fallback: skip)\n        const m = bd.querySelector('.bk-detail-buy-btn,.bk-detail-owned-btn');\n        // Find any visible bike \u2014 use selected garage one as best-guess\n      }\n      const upgOv = document.getElementById('grUpgModalOverlay');\n      if(upgOv && upgOv.classList.contains('open') && typeof openUpgModal==='function' && _garageSelectedLv){\n        openUpgModal(_garageSelectedLv);\n      }\n      const biOv = document.getElementById('bikeInfoModalOverlay');\n      if(biOv && biOv.classList.contains('open') && typeof openBikeInfoModal==='function'){\n        openBikeInfoModal();\n      }\n      // Refresh open profile sub-page (deposit/withdraw/missions/referrals/partnership)\n      const psp = document.getElementById('profileSubPage');\n      if(psp && psp.style.display!=='none'){\n        const curPage = psp.getAttribute('data-page');\n        if(curPage && typeof openProfilePage==='function') openProfilePage(curPage);\n      }\n    }catch(e){}\n  }catch(err){ console.error('setLang error',err); }\n  const m=document.getElementById('langMenu'); if(m) m.style.display='none';\n  if(typeof syncFinanceHeader===\"function\") try{syncFinanceHeader();}catch(e){}\n  if(typeof showNotif==='function') showNotif(flag+' '+code, 'w');\n}\nfunction applyLang(lang,flag,code){\n  const t=TRANSLATIONS[lang]||TRANSLATIONS['en'];\n  // Top header lang button (may be absent on some pages)\n  const lf=document.getElementById('langFlag'); if(lf) lf.textContent=flag;\n  const lc=document.getElementById('langCode'); if(lc) lc.textContent=code;\n  // Profile page lang button\n  const lfF=document.getElementById('langFlagFin'); if(lfF) lfF.textContent=flag;\n  const lcF=document.getElementById('langLblFin'); if(lcF) lcF.textContent=code;\n  document.querySelectorAll('.lang-opt').forEach(el=>el.classList.toggle('active',el.dataset.lang===lang));\n  document.documentElement.dir=lang==='ar'?'rtl':'ltr';\n  document.documentElement.lang=lang;\n  // Sync ALL lang indicators (covers profile, header, mining, garage)\n  document.querySelectorAll('[data-lang-flag]').forEach(el=>{el.textContent=flag;});\n  document.querySelectorAll('[data-lang-code]').forEach(el=>{el.textContent=code;});\n\n  // \u2500\u2500 Loading screen text (if still visible) \u2500\u2500\n  const ldStat=document.getElementById('ldStatus');\n  if(ldStat && !ldStat.style.color) ldStat.textContent=t.ldLoading||'Loading...';\n  const ldRetryBtn=document.getElementById('ldRetryBtn');\n  if(ldRetryBtn) ldRetryBtn.textContent=t.ldRetryBtn||'\ud83d\udd04 Retry';\n\n  // \u2500\u2500 Universal data-i18n engine \u2500\u2500\n  document.querySelectorAll('[data-i18n]').forEach(el=>{\n    const key=el.dataset.i18n;\n    if(t[key]!==undefined) el.innerHTML=t[key];\n  });\n  // \u2500\u2500 data-i18n-ph: placeholder translation \u2500\u2500\n  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{\n    const key=el.dataset.i18nPh;\n    if(t[key]!==undefined) el.placeholder=t[key];\n  });\n\n  // \u2500\u2500 Nav labels \u2500\u2500\n  const navItems=document.querySelectorAll('.ni .ni-lbl');\n  const navKeys=['navFinance'];\n  navItems.forEach((el,i)=>{if(navKeys[i]) el.textContent=t[navKeys[i]];});\n\n  // \u2500\u2500 Finance tabs \u2500\u2500 (handled by data-i18n)\n  // Finance tab labels use data-i18n spans inside, updated by universal engine above\n\n  // \u2500\u2500 Claim button (keep image) \u2500\u2500\n  const claimTxt=document.getElementById('claimBtnTxt');\n  if(claimTxt){const img=claimTxt.querySelector('img');claimTxt.textContent=t.claimBtn;if(img)claimTxt.prepend(img);}\n\n  // \u2500\u2500 Deposit button (keep icon) \u2500\u2500\n  const depBtn=document.getElementById('submitDepositBtn');\n  if(depBtn) depBtn.innerHTML=`<i class=\"fas fa-arrow-down\"></i> ${t.depositBtn}`;\n\n  // \u2500\u2500 Connect wallet button (keep icon, preserve disconnect state) \u2500\u2500\n  const connBtn=document.getElementById('connectWalletBtn');\n  if(connBtn){\n    if(connBtn.classList.contains('is-disconnect')){\n      connBtn.innerHTML='<i class=\"fas fa-unlink\"></i> Disconnect';\n      connBtn.onclick=disconnectWallet;\n    } else {\n      connBtn.innerHTML=`<i class=\"fas fa-plug\"></i> ${t.connectBtn}`;\n      connBtn.onclick=connectWallet;\n    }\n  }\n\n  // \u2500\u2500 Withdraw button (keep image) \u2500\u2500\n  const wdBtn=document.getElementById('wdBtn');\n  if(wdBtn){const img=wdBtn.querySelector('img');wdBtn.textContent=t.withdrawBtn;if(img)wdBtn.prepend(img);}\n\n  // \u2500\u2500 Copy buttons \u2500\u2500\n  document.querySelectorAll('.btn-copy').forEach(el=>el.innerHTML=`<i class=\"fas fa-copy\"></i> ${t.copyBtn}`);\n\n  // \u2500\u2500 Float add task \u2500\u2500\n  const floatBtn=document.getElementById('floatAddTask');\n  if(floatBtn) floatBtn.innerHTML=`\u2795 ${t.floatAdd}`;\n\n  // Season 2 removed\n\n  // \u2500\u2500 walletAddressDisplay: only if still showing default (not connected) \u2500\u2500\n  const wadEl=document.getElementById('walletAddressDisplay');\n  if(wadEl && !wadEl.classList.contains('is-connected')){\n    wadEl.innerHTML=`${t.notConnected}<span class=\"conn-dot\"></span><span class=\"conn-lbl\">Connected</span>`;\n    wadEl.dataset.defaultShown='1';\n  }\n}\n\n\n}\n\n\"}];

function setHead(){
  if(TITLE) document.title = TITLE;
  var vp = document.createElement('meta');
  vp.name='viewport'; vp.content=VIEWPORT;
  document.head.appendChild(vp);
  OTHER_META.forEach(function(t){ var d=document.createElement('div'); d.innerHTML=t.trim(); var el=d.firstChild; if(el) document.head.appendChild(el); });
  OTHER_LINKS.forEach(function(t){ var d=document.createElement('div'); d.innerHTML=t.trim(); var el=d.firstChild; if(el) document.head.appendChild(el); });
  CSS_HREFS.forEach(function(href){
    var l=document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l);
  });
  if(INLINE_CSS){
    var s=document.createElement('style'); s.textContent=INLINE_CSS; document.head.appendChild(s);
  }
}

function loadExt(src){
  return new Promise(function(res){
    var s=document.createElement('script'); s.src=src; s.async=false;
    s.onload=function(){res();}; s.onerror=function(){res();};
    document.head.appendChild(s);
  });
}

function runInline(code){
  return new Promise(function(res){
    var s=document.createElement('script');
    s.text = code;
    document.body.appendChild(s);
    res();
  });
}

async function runSeq(list){
  for(var i=0;i<list.length;i++){
    var it = list[i];
    if(it.type==='ext') await loadExt(it.src);
    else await runInline(it.code);
  }
}

async function boot(){
  setHead();
  // Load head-level scripts first (telegram SDK, SW registration, etc.)
  await runSeq(HEAD_SCRIPTS);
  // Mount body content into #app (or body if missing)
  var mount = document.getElementById('app') || document.body;
  mount.innerHTML = BODY_HTML;
  // Then run body scripts in original order
  await runSeq(BODY_SCRIPTS);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else { boot(); }
